<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-analysis-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-analysis-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUBE Marking Coach - Effectiveness Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #040d18;
  --navy-mid: #0a1628;
  --surface: #0e1e34;
  --surface2: #141e30;
  --border: rgba(255,255,255,0.08);
  --border-gold: rgba(201,168,76,0.3);
  --text: #e8eaf0;
  --text-dim: #7a9ab8;
  --gold: #c9a84c;
  --gold-light: #e8c96a;
  --green: #43d9ad;
  --red: #ff6b6b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.025'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}

/* HEADER */
header {
  padding: 1.25rem 2.5rem;
  border-bottom: 1px solid var(--border);
  background: rgba(4,13,24,0.96);
  backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 50;
}
.eyebrow {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 0.62rem; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 0.3rem;
}
h1 {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 1.6rem; font-weight: 800; line-height: 1.1; color: var(--text);
}
h1 span { color: var(--gold); }
.scope-badge {
  display:inline-block; margin-top:0.35rem;
  font-family:'IBM Plex Mono',monospace; font-size:0.62rem; letter-spacing:0.08em;
  background:rgba(201,168,76,0.12); border:1px solid rgba(201,168,76,0.3);
  color:var(--gold-light); border-radius:20px; padding:0.18rem 0.65rem;
}
.header-right { display:flex; flex-direction:column; align-items:flex-end; gap:0.5rem; }
.btn-refresh, .btn-research {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
  border: none; padding: 0.55rem 1.25rem;
  border-radius: 8px; cursor: pointer; font-weight: 700;
  transition: opacity 0.2s; text-decoration: none; display: inline-block;
}
.btn-refresh { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color:#040d18; box-shadow:0 4px 16px rgba(201,168,76,0.25); }
.btn-research { background: linear-gradient(135deg, #e8621a, #f0873a); color:#fff; box-shadow:0 4px 16px rgba(232,98,26,0.35); }
.btn-refresh:hover, .btn-research:hover { opacity: 0.85; }
.status-line { font-size: 0.7rem; color: var(--text-dim); display:flex; align-items:center; gap:0.4rem; flex-wrap:wrap; justify-content:flex-end; }
.dot { width:7px; height:7px; border-radius:50%; background:var(--text-dim); display:inline-block; flex-shrink:0; }
.dot.live { background:var(--green); box-shadow:0 0 6px var(--green); }
.dot.err  { background:var(--red); }
.switch-key { background:none; border:none; color:var(--text-dim); font-size:0.62rem; cursor:pointer; text-decoration:underline; padding:0; font-family:inherit; }
.switch-key:hover { color:var(--gold); }

/* SUBJECT CHIPS */
#subject-bar { padding: 1rem 2.5rem 0.4rem; border-bottom: 1px solid var(--border); background: var(--navy-mid); }
.bar-label-sm {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 0.6rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 0.6rem;
}
.chip-row { display:flex; flex-wrap:wrap; gap:0.5rem; padding-bottom:0.85rem; }
.chip {
  display:flex; align-items:center; gap:0.45rem;
  background: linear-gradient(135deg, var(--surface), var(--navy-mid));
  border:1.5px solid var(--border); border-radius: 24px;
  padding: 0.42rem 0.95rem; cursor:pointer;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:0.8rem; font-weight:700; color:var(--text);
  transition: border-color 0.2s, background 0.2s, color 0.2s; white-space:nowrap;
}
.chip:hover { border-color: rgba(240,192,48,0.7); }
.chip-count { font-family:'IBM Plex Mono',monospace; font-size:0.55rem; color:#f0c030; font-weight:700; }
.chip-kla { font-family:'IBM Plex Mono',monospace; font-size:0.5rem; letter-spacing:0.1em; color:var(--text-dim); text-transform:uppercase; }

/* CLASS PILLS */
#class-bar { padding: 0.7rem 2.5rem; border-bottom: 1px solid var(--border); background: rgba(10,22,40,0.6); display:none; }
.pill-row { display:flex; flex-wrap:wrap; gap:0.45rem; align-items:center; }
.class-pill {
  font-family:'IBM Plex Mono',monospace; font-size:0.66rem; font-weight:700; letter-spacing:0.06em;
  background: transparent; border:1.5px solid var(--border); color:var(--text-dim);
  border-radius: 18px; padding: 0.3rem 0.85rem; cursor:pointer; transition: all 0.18s;
}
.class-pill:hover { color:var(--text); border-color: rgba(255,255,255,0.25); }

/* MAIN */
main { padding: 1.5rem 2.5rem; }
#loading-screen { display:none; text-align:center; padding:5rem 2rem; }
.spinner { width:36px; height:36px; border:2px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 1rem; }
@keyframes spin { to { transform:rotate(360deg); } }
#error-screen { display:none; text-align:center; padding:4rem 2rem; }
.error-box { max-width:520px; margin:0 auto; background:rgba(255,107,107,0.07); border:1px solid rgba(255,107,107,0.25); border-radius:12px; padding:2rem; }
.error-title { font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:800; font-size:1rem; color:var(--red); margin-bottom:0.75rem; }
.error-msg { font-size:0.82rem; color:var(--text-dim); line-height:1.7; }
#dashboard { display:none; }

/* WEEK NAV */
.week-nav{display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem;background:rgba(255,255,255,0.03);border:1px solid rgba(201,168,76,0.3);border-radius:10px;padding:0.7rem 1.2rem;}
.week-nav-btn{background:rgba(201,168,76,0.18);border:2px solid rgba(201,168,76,0.55);color:var(--gold-light);border-radius:8px;padding:0.4rem 1rem;cursor:pointer;font-size:1.1rem;font-weight:900;transition:all 0.15s;line-height:1;letter-spacing:0.05em;}
.week-nav-btn:hover{background:rgba(201,168,76,0.35);border-color:var(--gold-light);color:#fff;}
.week-nav-btn:disabled{opacity:0.25;cursor:default;}
.week-label{font-family:'IBM Plex Mono',monospace;font-size:0.95rem;letter-spacing:0.06em;color:#ffffff;flex:1;text-align:center;font-weight:700;}
.week-badge{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.3);color:var(--gold);border-radius:20px;padding:0.2rem 0.6rem;}

/* PANELS */
.panel {
  background: linear-gradient(135deg, var(--surface), var(--navy-mid));
  border: 1px solid var(--border-gold); border-radius: 12px; padding: 1.25rem;
}
.panel-title {
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size:0.87rem; font-weight:700; letter-spacing:0.15em; text-transform:uppercase;
  color:#f0c030; margin-bottom:1rem; padding-bottom:0.55rem;
  border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:0.5rem; flex-wrap:wrap;
}
.panel-title span { color:#ffffff; font-weight:600; font-size:0.7rem; letter-spacing:0.05em; text-transform:none; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; margin-bottom:1.25rem; }
.mb { margin-bottom:1.25rem; }
.no-data { text-align:center; padding:1.5rem; color:var(--text-dim); font-size:0.82rem; font-style:italic; }

/* TROPHIES */
.trophy-banner{background:linear-gradient(135deg,rgba(201,168,76,0.12),rgba(201,168,76,0.05));border:1px solid rgba(201,168,76,0.35);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;}
.trophy-title{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:0.65rem;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:0.75rem;}
.trophy-row{display:flex;gap:0.75rem;flex-wrap:wrap;}
.trophy-card{flex:1;min-width:140px;display:flex;align-items:center;gap:0.6rem;background:rgba(0,0,0,0.2);border-radius:8px;padding:0.6rem 0.9rem;border:1px solid rgba(255,255,255,0.07);}
.trophy-medal{font-size:1.4rem;line-height:1;flex-shrink:0;}
.trophy-name{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:700;font-size:0.85rem;color:#fff;}
.trophy-xp{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--gold);margin-top:0.1rem;}

/* HERO USAGE TABLE */
.student-table { width:100%; border-collapse:collapse; font-size:0.78rem; }
.student-table th { font-family:'IBM Plex Mono',monospace; font-size:0.66rem; letter-spacing:0.1em; text-transform:uppercase; color:#e8eaf0; text-align:left; padding:0.45rem 0.7rem; border-bottom:1px solid var(--border); font-weight:700; }
.student-table td { padding:0.5rem 0.7rem; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle; }
.student-table tr:last-child td { border-bottom:none; }
.student-table tr:hover td { background:rgba(201,168,76,0.04); }
.usage-foot { font-size:0.7rem; color:var(--text-dim); margin-top:0.75rem; }
.mono { font-family:'IBM Plex Mono',monospace; }

/* INSIGHT TILES */
.insight-row { display:grid; grid-template-columns:repeat(5,1fr); gap:1rem; }
.insight-tile {
  background: linear-gradient(135deg, var(--surface), var(--navy-mid));
  border: 1px solid var(--border-gold); border-radius: 10px;
  padding: 0.9rem 1.1rem; position: relative; overflow: hidden;
}
.insight-tile::before { content:''; position:absolute; top:0;left:0;right:0;height:2px; background:var(--gold); }
.tile-label { font-family:'IBM Plex Mono',monospace; font-size:0.54rem; letter-spacing:0.14em; text-transform:uppercase; color:#e8eaf0; margin-bottom:0.4rem; }
.tile-value { font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:1.5rem; font-weight:800; line-height:1.05; }
.tile-sub { font-size:0.66rem; color:#c8d8e8; margin-top:0.25rem; line-height:1.35; }
.clr-green{color:#39ff6e;} .clr-amber{color:#ffb830;} .clr-red{color:#ff4f4f;}
.detail-toggle {
  display:block; width:100%; margin-top:0.9rem; text-align:center;
  background:rgba(255,255,255,0.03); border:1px dashed var(--border-gold); color:var(--gold);
  border-radius:8px; padding:0.45rem; cursor:pointer;
  font-family:'IBM Plex Mono',monospace; font-size:0.64rem; letter-spacing:0.1em; text-transform:uppercase; font-weight:700;
}
.detail-toggle:hover { background:rgba(201,168,76,0.08); }

/* ACCORDIONS */
.accordion { border:1px solid var(--border-gold); border-radius:12px; background:linear-gradient(135deg, var(--surface), var(--navy-mid)); margin-bottom:1.25rem; overflow:hidden; }
.acc-head {
  width:100%; display:flex; justify-content:space-between; align-items:center; gap:0.5rem;
  background:none; border:none; cursor:pointer; padding:0.95rem 1.25rem;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:0.82rem; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:#f0c030;
}
.acc-head .acc-sub { color:#fff; font-weight:600; font-size:0.68rem; letter-spacing:0.05em; text-transform:none; margin-left:auto; margin-right:0.75rem; }
.acc-chev { color:var(--text-dim); transition: transform 0.2s; font-size:0.8rem; }
.accordion.open .acc-chev { transform: rotate(180deg); }
.acc-body { display:none; padding:0 1.25rem 1.25rem; }
.accordion.open .acc-body { display:block; }

/* BARS */
.bar-chart { display:flex; flex-direction:column; gap:0.55rem; }
.bar-row { display:flex; align-items:center; gap:0.7rem; }
.bar-label { font-size:0.82rem; width:160px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#e8eaf0; }
.bar-track { flex:1; height:5px; background:rgba(255,255,255,0.05); border-radius:3px; overflow:hidden; }
.bar-fill { height:100%; border-radius:3px; transition:width 0.9s cubic-bezier(0.4,0,0.2,1); }
.bar-val { font-family:'IBM Plex Mono',monospace; font-size:0.68rem; width:46px; text-align:right; color:#e8eaf0; }
.mission-freq { display:flex; flex-direction:column; gap:0.5rem; }
.mission-row { display:flex; align-items:center; gap:0.75rem; }
.mission-name { font-size:0.78rem; width:180px; flex-shrink:0; color:#e8eaf0; }
.mission-bar-track { flex:1; height:5px; background:rgba(255,255,255,0.05); border-radius:3px; overflow:hidden; }
.mission-bar-fill { height:100%; border-radius:3px; }
.mission-count { font-family:'IBM Plex Mono',monospace; font-size:0.65rem; color:#ffffff; width:24px; text-align:right; font-weight:700; }

/* IMPROVEMENT CARDS */
.example-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:0.75rem; }
.example-card { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:10px; padding:0.9rem 1rem; }
.example-card.fix-causal { border-left-color:#4fc3f7; }
.example-card.fix-noun   { border-left-color:#a78bfa; }
.example-card.fix-flow   { border-left-color:#43d9ad; }
.example-card.fix-mod    { border-left-color:#e8a030; }
.example-card.fix-other  { border-left-color:#6b7599; }
.ex-label { font-family:'IBM Plex Mono',monospace; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; color:#e8eaf0; margin-bottom:0.35rem; font-weight:600; }
.ex-before { font-size:0.77rem; color:var(--red); margin-bottom:0.3rem; }
.ex-before::before { content:'\2717 '; }
.ex-after  { font-size:0.77rem; color:var(--green); }
.ex-after::before  { content:'\2713 '; }
.ex-kw { font-size:0.72rem; color:#c8d8e8; margin-top:0.3rem; font-style:italic; }

/* PILLS + VIEW TOGGLE */
.pill { display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:0.58rem; letter-spacing:0.06em; padding:0.15rem 0.5rem; border-radius:20px; border:1px solid var(--border); }
.pill.high { background:rgba(67,217,173,0.15); color:var(--green);  border-color:rgba(67,217,173,0.3); }
.pill.mid  { background:rgba(201,168,76,0.15);  color:var(--gold);   border-color:rgba(201,168,76,0.3); }
.pill.low  { background:rgba(255,107,107,0.15); color:var(--red);    border-color:rgba(255,107,107,0.3); }
.view-toggle { display:flex; gap:10px; margin-bottom:1.25rem; }
.view-btn {
  padding:8px 20px; border-radius:8px; border:1.5px solid var(--border); background:transparent; color:var(--text-dim);
  font-family:'IBM Plex Mono',monospace; font-size:0.72rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer;
}
.view-btn.active { border-color:var(--gold); background:rgba(201,168,76,0.15); color:var(--gold); }
.show-all-btn {
  display:block; margin:0.75rem auto 0; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--text-dim);
  border-radius:8px; padding:0.4rem 1.2rem; cursor:pointer;
  font-family:'IBM Plex Mono',monospace; font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase; font-weight:700;
}
.show-all-btn:hover { color:var(--gold); border-color:var(--border-gold); }

/* ── MOBILE ── This dashboard is standalone GitHub Pages (NOT inside the
   Google Sites iframe), so plain media queries are reliable here. */
@media(max-width:768px){
  header{ padding:0.9rem 1rem; }
  h1{ font-size:1.25rem; }
  .header-right{ align-items:flex-start; width:100%; }
  #subject-bar, #class-bar{ padding-left:1rem; padding-right:1rem; }
  .chip-row{ flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar{ display:none; }
  main{ padding:1rem; }
  .insight-row{ grid-template-columns:repeat(2,1fr); gap:0.7rem; }
  .grid-2{ grid-template-columns:1fr; }
  .week-nav{ padding:0.55rem 0.7rem; gap:0.5rem; }
  .week-label{ font-size:0.78rem; }
  .week-nav-btn{ padding:0.35rem 0.7rem; font-size:0.9rem; }
  .trophy-card{ min-width:110px; padding:0.5rem 0.7rem; }
  .student-table{ font-size:0.72rem; }
  .student-table th, .student-table td{ padding:0.4rem 0.45rem; }
  .bar-label{ width:110px; font-size:0.72rem; }
  .mission-name{ width:120px; font-size:0.72rem; }
}
@media(max-width:480px){
  .insight-row{ grid-template-columns:repeat(2,1fr); }
  .hide-xs{ display:none; }
  .week-badge{ display:none; }
  .trophy-row{ flex-direction:column; }
}
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">CUBE Marking Coach</div>
    <h1><span>Effectiveness</span> Tracker</h1>
    <span class="scope-badge" id="scope-badge" style="display:none"></span>
  </div>
  <div class="header-right">
    <div style="display:flex;gap:0.6rem;align-items:center">
      <button class="btn-refresh" onclick="loadSheets()">&#8635; Refresh Data</button>
      <a class="btn-research" href="research/index.html">&#128300; Research</a>
    </div>
    <div class="status-line">
      <span class="dot" id="sdot"></span>
      <span id="stxt">Connecting&hellip;</span>
      <button class="switch-key" onclick="switchKey()">switch key</button>
    </div>
  </div>
</header>

<div id="subject-bar" style="display:none">
  <div class="bar-label-sm">Your Subjects</div>
  <div class="chip-row" id="chip-row"></div>
</div>
<div id="class-bar">
  <div class="pill-row" id="pill-row"></div>
</div>

<main>
  <div id="loading-screen">
    <div class="spinner"></div>
    <div style="color:var(--text-dim);font-size:0.85rem">Loading CUBE Marking Coach data&hellip;</div>
  </div>
  <div id="error-screen">
    <div class="error-box">
      <div class="error-title">&#9888; Could not load data</div>
      <div class="error-msg" id="errmsg"></div>
    </div>
  </div>
  <div id="dashboard">
    <div class="week-nav">
      <button class="week-nav-btn" id="btn-week-prev" onclick="changeWeek(-1)">&#8592; Prev</button>
      <span class="week-label" id="week-label">Loading...</span>
      <span class="week-badge" id="week-badge">This week</span>
      <button class="week-nav-btn" id="btn-week-next" onclick="changeWeek(1)" disabled>Next &#8594;</button>
    </div>

    <!-- 1 · THIS WEEK HERO — combined SA + MC usage, Top 3, active students -->
    <div id="hero" class="mb"></div>

    <!-- SA / MC detail toggle (shown only for subjects with an MC bank) -->
    <div class="view-toggle" id="view-toggle" style="display:none">
      <button id="btn-view-sa" class="view-btn active" onclick="switchView('sa')">&#9997;&#65039; Short Answer</button>
      <button id="btn-view-mc" class="view-btn" onclick="switchView('mc')">&#128203; Multiple Choice</button>
    </div>

    <!-- SA DETAIL -->
    <div id="sa-detail">
      <div class="mb" id="improvements"></div>
      <div class="mb" id="insights"></div>
      <div id="acc-band"></div>
      <div id="acc-log"></div>
    </div>

    <!-- MC DETAIL -->
    <div id="mc-detail" style="display:none"></div>
  </div>
</main>

<script>
// Tab data comes through the Worker /sheet endpoint (owner-executed Apps
// Script) — the private spreadsheet's ID is not present in this public file.
const WORKER_BASE = 'https://cube-proxy.alan-3e2.workers.dev';
const BUILD = 'v2.0 \u00b7 2026-07-13 \u00b7 scoped keys + weekly hero + mobile';

// ── SUBJECT REGISTRY — SINGLE SOURCE OF TRUTH ──────────────────────────────
// v2 structure: one entry PER SUBJECT, with its class tabs nested. 'label' is
// what teachers see on the class pill (student-facing class name); 'tab' is the
// Google Sheet tab (must match the webhook TAB_MAP). To add a class: add one
// {label, tab} row. To add a subject: add one entry here (+ sheet tab + config).

// ── ACCESS KEY + SCOPE (dashkeys-v1.0) ───────────────────────────────────────
// One short key per subject faculty (e.g. PHYS-xxxx) or a master key. The
// Worker /dashscope endpoint resolves the key to a scope; /sheet then enforces
// the same scope server-side, so this file never decides what a key may see.
function getDashKey(){
  let k = sessionStorage.getItem('cube_dash_key') || '';
  if(!k){
    k = (window.prompt('Enter your CUBE dashboard access key\n(e.g. PHYS-XXXX, or your master key):') || '').trim();
    if(k) sessionStorage.setItem('cube_dash_key', k);
  }
  return k;
}
function clearDashKey(){ try { sessionStorage.removeItem('cube_dash_key'); } catch(_){} }
function switchKey(){ clearDashKey(); location.reload(); }

async function fetchScope(){
  for(let attempt=0; attempt<3; attempt++){
    const key = getDashKey();
    if(!key){ continue; }
    let r;
    try { r = await fetch(WORKER_BASE+'/dashscope?key='+encodeURIComponent(key), {cache:'no-store'}); }
    catch(e){ throw new Error('Could not reach the Worker \u2014 '+e.message); }
    if(r.status === 403){ clearDashKey(); alert('That access key was not recognised. Please try again.'); continue; }
    if(!r.ok) throw new Error('Scope check failed ('+r.status+')');
    return await r.json();
  }
  throw new Error('No valid access key entered. Reload the page to try again.');
}

function applyScope(){
  const allowed = SCOPE.role === 'master' ? null : new Set(SCOPE.tabs || []);
  VISIBLE = REGISTRY.map(function(s){
    const classes = allowed ? s.classes.filter(function(c){ return allowed.has(c.tab); }) : s.classes;
    return Object.assign({}, s, {classes: classes});
  }).filter(function(s){ return s.classes.length > 0; });
  SHEET_NAMES = [];
  MC_SHEET_NAMES = [];
  VISIBLE.forEach(function(s){
    s.classes.forEach(function(c){
      SHEET_NAMES.push(c.tab);
      if(s.hasMC) MC_SHEET_NAMES.push(c.tab+'_MC');
    });
  });
  const badge = document.getElementById('scope-badge');
  badge.textContent = SCOPE.role === 'master' ? '\ud83d\udd11 Master \u00b7 all subjects' : '\ud83d\udd11 '+(SCOPE.label||'Subject view');
  badge.style.display = 'inline-block';
  buildSubjectBar();
}

// ── WEEK WINDOW (Friday 3pm AEST boundaries) ─────────────
function getWeekBounds(offset) {
  // Week runs from Friday 3pm AEST to the following Friday 3pm AEST.
  // Find the most recent Friday 3pm AEST as the START of the current week.
  var now = new Date();
  var aestNow = new Date(now.getTime() + 10 * 3600 * 1000);
  var day = aestNow.getUTCDay();         // 0=Sun .. 5=Fri .. 6=Sat
  var hourFrac = aestNow.getUTCHours() + aestNow.getUTCMinutes()/60;
  // Days elapsed since the most recent Friday 3pm
  var daysSince = (day - 5 + 7) % 7;    // days since last Friday (by date)
  if (day === 5 && hourFrac < 15) daysSince = 7; // Friday before 3pm -> still last week
  // startMs = most recent Friday 3pm UTC (15:00 AEST = 05:00 UTC)
  var startMs = Date.UTC(aestNow.getUTCFullYear(), aestNow.getUTCMonth(), aestNow.getUTCDate(), 5, 0, 0, 0)
                - daysSince * 86400000;
  var endMs = startMs + 7 * 86400000;   // end = 7 days later (next Friday 3pm)
  return { start: new Date(startMs + offset * 7 * 86400000), end: new Date(endMs + offset * 7 * 86400000) };
}
function filterByWeek(rows, offset) {
  var b = getWeekBounds(offset);
  return rows.filter(function(r){
    if(!r.Timestamp) return false;
    var ts = new Date(r.Timestamp);
    return ts >= b.start && ts < b.end;
  });
}
function weekLabel(offset) {
  var b = getWeekBounds(offset);
  var fmt = function(d){ return d.toLocaleDateString('en-AU',{day:'numeric',month:'short',timeZone:'Australia/Sydney'}); };
  return fmt(b.start) + ' \u2013 ' + fmt(new Date(b.end.getTime()-1));
}
function changeWeek(delta) {
  weekOffset += delta;
  if (weekOffset > 0) weekOffset = 0;
  var lbl=document.getElementById('week-label');
  var bdg=document.getElementById('week-badge');
  var nxt=document.getElementById('btn-week-next');
  if(lbl) lbl.textContent=weekLabel(weekOffset);
  if(bdg) bdg.textContent=weekOffset===0?'This week':weekOffset===-1?'Last week':Math.abs(weekOffset)+' weeks ago';
  if(nxt) nxt.disabled=weekOffset>=0;
  renderAll();
}

// ── LOAD ─────────────────────────────────────────────────
async function loadSheets() {
  showScreen('loading'); setDot('','Connecting\u2026');
  tabData = {}; mcData = {};
  try {
    // Small batches — a burst of cold-start requests can time out; anything
    // that fails is flagged in loadFailed and retried once below.
    await runBatched(SHEET_NAMES, loadTab, 5);
    await runBatched(MC_SHEET_NAMES, loadMCTab, 5);
    if(loadFailed.size){
      const retrySA = SHEET_NAMES.filter(function(k){return loadFailed.has(k);});
      const retryMC = MC_SHEET_NAMES.filter(function(k){return loadFailed.has('MC:'+k);});
      if(retrySA.length) await runBatched(retrySA, loadTab, 3);
      if(retryMC.length) await runBatched(retryMC, loadMCTab, 3);
    }
    // Per-SUBJECT counts on the chips (sum across the subject's class tabs).
    VISIBLE.forEach(function(s){
      const el = document.getElementById('cnt-'+s.subj); if(!el) return;
      let sa=0, mc=0, failed=false;
      s.classes.forEach(function(c){
        sa += (tabData[c.tab]||[]).length;
        mc += (mcData[c.tab+'_MC']||[]).length;
        if(loadFailed.has(c.tab) || loadFailed.has('MC:'+c.tab+'_MC')) failed=true;
      });
      if(failed && sa===0 && mc===0){ el.textContent='\u26a0'; el.title='Load failed after retry \u2014 Refresh Data'; }
      else if(sa===0 && mc===0){ el.textContent='0'; el.title='No data yet'; }
      else { el.textContent = sa+'\u270d '+mc+'MC'; el.title = sa+' short-answer \u00b7 '+mc+' MC attempts (all time)'; }
    });
    setDot('live','Live \u00b7 '+new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'})+'  \u00b7  build '+BUILD);
    console.log('[CUBE dashboard] build:', BUILD);
    showScreen('dashboard');
    var lbl=document.getElementById('week-label');
    if(lbl) lbl.textContent=weekLabel(weekOffset);
    const first = VISIBLE.find(function(s){
      return s.classes.some(function(c){ return (tabData[c.tab]||[]).length>0 || (mcData[c.tab+'_MC']||[]).length>0; });
    }) || VISIBLE[0];
    selectSubject(activeSubj && subjEntry(activeSubj) ? activeSubj : first.subj);
  } catch(e) {
    setDot('err', e.message);
    document.getElementById('errmsg').textContent = e.message +
      ' \u2014 Check that the Worker is deployed, your access key is correct, and the ' +
      'Apps Script getTab deployment is on its latest version, then Refresh.';
    showScreen('error');
  }
}

async function runBatched(items, fn, size){
  size = size || 5;
  for(let i=0;i<items.length;i+=size){
    await Promise.all(items.slice(i,i+size).map(fn));
  }
}

// Fetch one tab's CSV through the Worker /sheet endpoint (owner-executed Apps
// Script, private-sheet safe). Scope is enforced server-side per tab.
async function fetchTabCsv(name){
  const ok = function(t){ return t && !t.trim().startsWith('<') && !t.trim().toLowerCase().startsWith('error'); };
  const key = sessionStorage.getItem('cube_dash_key') || '';
  const worker = WORKER_BASE+'/sheet?tab='+encodeURIComponent(name)+'&key='+encodeURIComponent(key);
  for(let attempt=0; attempt<2; attempt++){
    try {
      const r = await fetch(worker,{cache:'no-store'});
      if(r.status === 403){                       // key revoked mid-session — re-prompt next load
        clearDashKey();
        if(!window.__dashKeyWarned){ window.__dashKeyWarned = true; alert('Your access key was rejected. Reload the page to re-enter it.'); }
        return null;
      }
      if(r.ok){ const t = await r.text(); if(ok(t)) return t; }
    } catch(_){}
    if(attempt===0) await new Promise(function(res){setTimeout(res,400);});
  }
  return null;
}

async function loadTab(name) {
  const text = await fetchTabCsv(name);
  if(!text) { tabData[name]=[]; loadFailed.add(name); return; }   // failed ≠ empty
  loadFailed.delete(name);
  const rows = parseCSV(text);
  // Recalculate percentages from raw scores — avoids proxy column name/format issues
  rows.forEach(function(r){
    const awd = Number(r['Awd Mark']), qm = Number(r['Q Marks']);
    if(!isNaN(awd) && !isNaN(qm) && qm > 0) r['Mark %'] = awd / qm;
    const cxp = Number(r['CUBE XP']), cmax = Number(r['CUBE Max']);
    if(!isNaN(cxp) && !isNaN(cmax) && cmax > 0) r['CUBE %'] = cxp / cmax;
    const wxp = Number(r['Write XP']), wmax = Number(r['Write Max']);
    if(!isNaN(wxp) && !isNaN(wmax) && wmax > 0) r['Write %'] = wxp / wmax;
  });
  tabData[name] = rows.filter(function(r){return r.Student && String(r.Student)!=='Test Student' && String(r.Student).trim()!=='';});
}

async function loadMCTab(name) {
  const text = await fetchTabCsv(name);
  if(!text) { mcData[name]=[]; loadFailed.add('MC:'+name); return; }
  loadFailed.delete('MC:'+name);
  const rows = parseCSV(text);
  mcData[name] = rows.filter(function(r){return r.Student && String(r.Student).trim()!=='';});
}

  'illegible?':'Illegible ?','illegible ?':'Illegible ?',
  'qno':'Q No','q no':'Q No',
};
function cleanHeader(h) {
  const s = h.replace(/^["'\s]+|["'\s]+$/g,'').replace(/\s+/g,' ');
  return COL_ALIAS[s.toLowerCase()] || s;
}
// Layout reconciliation — tabs may mix historically "old-order" and "new-order"
// rows. Default to the tab header; remap a row only when its own column order
// (detected by where the model string sits) disagrees with the header.
const OLD_LAYOUT_KEYS = ['Timestamp','Student','Session','Attempt','Streak','Q No','Module',
  'Directive','Syllabus Kw','Stage','Model','CUBE XP','CUBE Max','CUBE %','Anno Ideas','Anno Used',
  'Anno XP','W-Con','W-Noun','W-Mod','W-Flow','W-Con Max','W-Noun Max','W-Mod Max','W-Flow Max',
  'Write XP','Write Max','Write %','Total XP','Awd Mark','Q Marks','Ind Band','Mark %',
  'Mission Category','Mission Fix','Student Phrase','Improved Version','Illegible ?','Word Count'];
const NEW_LAYOUT_KEYS = ['Timestamp','Student','Session','Attempt','Streak','Q No','Module',
  'Directive','Syllabus Kw','Stage','Sheet Tab','Model','CUBE XP','CUBE Max','Anno Ideas','Anno Used',
  'Anno XP','W-Con','W-Con Max','W-Noun','W-Noun Max','W-Mod','W-Mod Max','W-Flow','W-Flow Max',
  'Write XP','Write Max','Total XP','Awd Mark','Q Marks','Ind Band','Mission Category','Mission Fix',
  'Student Phrase','Improved Version','Illegible ?','Word Count','Mark %','Class'];
function looksLikeModel(s){ return /claude|sonnet|haiku|gpt/i.test(String(s==null?'':s)); }
function modelColIndex(vals){ return looksLikeModel(vals[10]) ? 10 : (looksLikeModel(vals[11]) ? 11 : -1); }
function parseCSV(text) {
  const lines = text.split('\n').filter(function(l){return l.trim();});
  if(lines.length<2) return [];
  const headers = splitRow(lines[0]).map(cleanHeader);
  const headerModelIdx = headers.findIndex(function(h){return String(h).toLowerCase().replace(/[^a-z]/g,'')==='model';});
  return lines.slice(1).map(function(line){
    const vals=splitRow(line);
    const dataModelIdx = modelColIndex(vals);
    if(dataModelIdx !== -1 && headerModelIdx !== -1 && dataModelIdx !== headerModelIdx){
      const keys = (dataModelIdx === 11) ? NEW_LAYOUT_KEYS : OLD_LAYOUT_KEYS;
      const obj={}; keys.forEach(function(k,i){ obj[k]=coerce(vals[i]); }); return obj;
    }
    const obj={}; headers.forEach(function(h,i){ obj[h]=coerce(vals[i]); }); return obj;
  });
}
function splitRow(row) {
  const out=[]; let inQ=false,cur='';
  for(let i=0;i<row.length;i++){
    const c=row[i];
    if(c==='"'&&!inQ){inQ=true;}
    else if(c==='"'&&inQ&&row[i+1]==='"'){cur+='"';i++;}
    else if(c==='"'&&inQ){inQ=false;}
    else if(c===','&&!inQ){out.push(cur);cur='';}
    else cur+=c;
  }
  out.push(cur); return out;
}
function coerce(v) {
  if(v==null) return null;
  const s=String(v).replace(/^["'\s]+|["'\s]+$/g,'').trim();
  if(!s||s==='#N/A'||s==='#VALUE!'||s==='#REF!') return null;
  const n=Number(s); return isNaN(n)?s:n;
}

// ── DATA ACCESS (subject + class scoped) ─────────────────
function scopedTabs(){
  const s = subjEntry(activeSubj); if(!s) return [];
  if(activeClassTab === 'ALL') return s.classes.map(function(c){return c.tab;});
  return s.classes.filter(function(c){return c.tab===activeClassTab;}).map(function(c){return c.tab;});
}
function saRowsAll(){  // all-time SA rows for current subject+class
  return scopedTabs().reduce(function(a,t){ return a.concat(tabData[t]||[]); }, []);
}
function mcRowsAll(){  // all-time MC rows for current subject+class
  const s = subjEntry(activeSubj); if(!s || !s.hasMC) return [];
  return scopedTabs().reduce(function(a,t){ return a.concat(mcData[t+'_MC']||[]); }, []);
}

// ── UI helpers ───────────────────────────────────────────
function showScreen(w) {
  document.getElementById('loading-screen').style.display = w==='loading' ?'block':'none';
  document.getElementById('error-screen').style.display   = w==='error'   ?'block':'none';
  document.getElementById('dashboard').style.display      = w==='dashboard'?'block':'none';
}
function setDot(cls,msg) {
  document.getElementById('sdot').className='dot'+(cls?' '+cls:'');
  document.getElementById('stxt').textContent=msg;
}
function hexToRgba(hex,a){
  var m=String(hex||'').replace('#','');
  if(m.length===3) m=m.split('').map(function(c){return c+c;}).join('');
  var n=parseInt(m,16); if(isNaN(n)) return 'rgba(240,192,48,'+a+')';
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function avg(a){return a.length?a.reduce(function(s,v){return s+v;},0)/a.length:0;}
function pct(v){return Math.round((v||0)*100)+'%';}
function groupBy(a,fn){return a.reduce(function(acc,i){const k=fn(i);if(!acc[k])acc[k]=[];acc[k].push(i);return acc;},{});}
function colourCls(val, hi, mid) {
  if(val==null||isNaN(val)) return '';
  if(val>=hi) return 'clr-green';
  if(val>=mid) return 'clr-amber';
  return 'clr-red';
}
function mcIsCorrect(r){
  var v = r['Correct (Y/N)']; if(v==null) v=r.Correct; if(v==null) v='';
  v = String(v).trim().toLowerCase();
  return v==='y' || v==='yes' || v==='true' || v==='1';
}
function normM(m){
  if(!m)return'Other';
  const map={
    'complex noun groups':'Complex Noun Groups','complexnoungroups':'Complex Noun Groups',
    'c \u2014 complex noun groups':'Complex Noun Groups',
    'logicalflow':'Logical Flow & Structure','logical flow':'Logical Flow & Structure',
    'l \u2014 logical flow & structure':'Logical Flow & Structure','structure':'Logical Flow & Structure',
    'modality':'Modality',
    'm \u2014 modality':'Modality',
    'causalconnectives':'Causal Connectives','causal connectives':'Causal Connectives',
    'b \u2014 because/but/so (causal connectives)':'Causal Connectives',
    'handwriting clarity':'Legibility of handwritten response',
    'legibility and precision':'Legibility of handwritten response',
    'legibility':'Legibility of handwritten response',
    'technical communication':'Technical Vocabulary','technical accuracy':'Technical Vocabulary',
    'technical detail':'Technical Vocabulary','technical precision':'Technical Vocabulary',
    'content depth':'Content Depth','content completeness':'Content Completeness','clarity':'Clarity',
  };
  const hit = map[String(m).toLowerCase()];
  if(hit) return hit;
  const s = String(m);
  if(/^[a-z]+([A-Z][a-z]+)+$/.test(s))
    return s.replace(/([A-Z])/g,' $1').replace(/^./,function(c){return c.toUpperCase();}).trim();
  return s;
}

// 1 · THIS WEEK HERO — combined SA + MC usage --------------------------------
function renderHero(s){
  const saAll = saRowsAll(), mcAll = mcRowsAll();
  const saWk = filterByWeek(saAll, weekOffset), mcWk = filterByWeek(mcAll, weekOffset);
  const el = document.getElementById('hero');
  const classLabel = activeClassTab==='ALL'
    ? (s.classes.length>1 ? 'all classes' : (s.classes[0]&&s.classes[0].label)||'')
    : ((s.classes.find(function(c){return c.tab===activeClassTab;})||{}).label||activeClassTab);

  // Per-student weekly rollup: written count, MC count, combined XP, last active
  const stu = {};
  function ensure(n){ if(!stu[n]) stu[n]={name:n, sa:0, mc:0, xp:0, last:null}; return stu[n]; }
  saWk.forEach(function(r){
    if(!r.Student) return;
    const o=ensure(r.Student); o.sa++;
    o.xp += Math.round(Number(r['Total XP'])||0);
    const ts=new Date(r.Timestamp); if(!o.last||ts>o.last) o.last=ts;
  });
  mcWk.forEach(function(r){
    if(!r.Student) return;
    const o=ensure(r.Student); o.mc++;
    o.xp += Math.round(Number(r['XP Earned'])||0);
    const ts=new Date(r.Timestamp); if(!isNaN(ts) && (!o.last||ts>o.last)) o.last=ts;
  });
  const active = Object.values(stu).sort(function(a,b){return b.xp-a.xp || (b.sa+b.mc)-(a.sa+a.mc);});
  const everSeen = new Set(saAll.map(function(r){return r.Student;}).concat(mcAll.map(function(r){return r.Student;})).filter(Boolean));
  const inactive = Math.max(0, everSeen.size - active.length);

  // Trophy Top 3 by combined XP
  const medals=['\ud83c\udfc6','\ud83e\udd48','\ud83e\udd49'];
  const top3 = active.slice(0,3);
  const trophy = top3.length ?
    '<div class="trophy-banner">'+
      '<div class="trophy-title">\ud83c\udfc6 This Week\u2019s Top 3 \u2014 '+esc(s.full)+' ('+esc(classLabel)+') \u00b7 XP from written + MC</div>'+
      '<div class="trophy-row">'+top3.map(function(t,i){
        return '<div class="trophy-card"><div class="trophy-medal">'+medals[i]+'</div><div><div class="trophy-name">'+esc(t.name)+'</div><div class="trophy-xp">'+t.xp+' XP \u00b7 '+t.sa+'\u270d '+t.mc+'MC</div></div></div>';
      }).join('')+'</div>'+
    '</div>' : '';

  const dayName = function(d){ return d ? d.toLocaleDateString('en-AU',{weekday:'short',timeZone:'Australia/Sydney'}) : '\u2014'; };
  const table = active.length ? (
    '<div style="overflow-x:auto"><table class="student-table">'+
      '<thead><tr><th>#</th><th>Student</th><th>\u270d\ufe0f Written</th><th>\ud83d\udccb MC</th><th>XP</th><th class="hide-xs">Last active</th></tr></thead>'+
      '<tbody>'+active.map(function(t,i){
        return '<tr><td class="mono" style="color:var(--text-dim)">'+(i+1)+'</td>'+
          '<td style="font-weight:600">'+esc(t.name)+'</td>'+
          '<td class="mono">'+(t.sa||'\u2014')+'</td>'+
          '<td class="mono">'+(t.mc||'\u2014')+'</td>'+
          '<td class="mono" style="color:var(--gold);font-weight:700">'+t.xp+'</td>'+
          '<td class="hide-xs" style="font-size:0.7rem;color:var(--text-dim)">'+dayName(t.last)+'</td></tr>';
      }).join('')+'</tbody></table></div>'+
    '<div class="usage-foot">'+active.length+' student'+(active.length!==1?'s':'')+' active this week \u00b7 '+
      inactive+' student'+(inactive!==1?'s':'')+' seen previously with no activity this week</div>'
  ) : '<div class="no-data">No activity this week for '+esc(s.full)+' ('+esc(classLabel)+'). Use \u2190 Prev to look at earlier weeks.</div>';

  el.innerHTML =
    trophy+
    '<div class="panel">'+
      '<div class="panel-title">This Week \u00b7 Who\u2019s Been Using CUBE <span>'+esc(s.full)+' \u00b7 '+esc(classLabel)+'</span></div>'+
      table+
    '</div>';
}

// 3 · COACHING INSIGHTS — 5 headline tiles + expandable full detail ----------
function renderInsights(s){
  const el = document.getElementById('insights');
  const rows = filterByWeek(saRowsAll(), weekOffset);
  if(!rows.length){
    el.innerHTML = '<div class="panel"><div class="panel-title">Coaching Insights <span>this week</span></div>'+
      '<div class="no-data">No written submissions this week \u2014 insights will appear as students submit.</div></div>';
    return;
  }
  // Avg mark
  const vm = rows.filter(function(r){return r['Mark %']!=null;});
  const aM = vm.length ? avg(vm.map(function(r){return r['Mark %'];})) : null;
  // Weakest directive (lowest avg Mark % — prefer directives with ≥2 samples)
  const byDir = groupBy(vm, function(r){return r.Directive||'Unknown';});
  let dirStats = Object.entries(byDir).map(function(e){return {label:e[0], val:avg(e[1].map(function(r){return r['Mark %'];})), count:e[1].length};});
  const multi = dirStats.filter(function(d){return d.count>=2;});
  const weakest = (multi.length?multi:dirStats).sort(function(a,b){return a.val-b.val;})[0] || null;
  // Top literacy focus area (most frequent coaching category, 4 core tools)
  const FOCUS_ORDER=['Causal Connectives','Complex Noun Groups','Modality','Logical Flow & Structure'];
  const mc={}; rows.forEach(function(r){const m=normM(r['Mission Category']);mc[m]=(mc[m]||0)+1;});
  const focus = FOCUS_ORDER.filter(function(k){return mc[k]>0;})
    .map(function(k){return {name:k,count:mc[k]};})
    .sort(function(a,b){return b.count-a.count;})[0] || null;
  // CUBE attempted / annotations used
  const cubeRows = rows.filter(function(r){return r['CUBE XP']!=null;});
  const cubeAttempted = cubeRows.filter(function(r){return r['CUBE XP']>0;}).length;
  const cubePctAttempt = cubeRows.length>0 ? cubeAttempted/cubeRows.length : null;
  const aR = rows.filter(function(r){return r['Anno Ideas']!=null && r['Anno Used']!=null;});
  const tI = aR.reduce(function(sum,r){return sum+(r['Anno Ideas']||0);},0);
  const tU = aR.reduce(function(sum,r){return sum+(r['Anno Used']||0);},0);
  const ar = tI>0 ? tU/tI : null;

  const tiles =
    '<div class="insight-row">'+
      '<div class="insight-tile"><div class="tile-label">Avg Mark</div>'+
        '<div class="tile-value '+colourCls(aM,0.75,0.5)+'">'+(aM!=null?pct(aM):'\u2014')+'</div>'+
        '<div class="tile-sub">'+vm.length+' marked submission'+(vm.length!==1?'s':'')+'</div></div>'+
      '<div class="insight-tile"><div class="tile-label">Weakest Directive</div>'+
        '<div class="tile-value clr-red" style="font-size:1.05rem;line-height:1.2">'+(weakest?esc(weakest.label):'\u2014')+'</div>'+
        '<div class="tile-sub">'+(weakest?pct(weakest.val)+' avg \u00b7 teach this verb next':'no marked work yet')+'</div></div>'+
      '<div class="insight-tile"><div class="tile-label">Top Literacy Focus</div>'+
        '<div class="tile-value clr-amber" style="font-size:1.05rem;line-height:1.2">'+(focus?esc(focus.name):'\u2014')+'</div>'+
        '<div class="tile-sub">'+(focus?focus.count+' student'+(focus.count!==1?'s':'')+' coached here':'no coaching data yet')+'</div></div>'+
      '<div class="insight-tile"><div class="tile-label">CUBE Attempted</div>'+
        '<div class="tile-value '+colourCls(cubePctAttempt,0.7,0.45)+'">'+(cubePctAttempt!=null?pct(cubePctAttempt):'\u2014')+'</div>'+
        '<div class="tile-sub">of submissions had CUBE markings</div></div>'+
      '<div class="insight-tile"><div class="tile-label">Annotations Used</div>'+
        '<div class="tile-value '+colourCls(ar,0.7,0.45)+'">'+(ar!=null?pct(ar):'\u2014')+'</div>'+
        '<div class="tile-sub">of annotated ideas made it into the response</div></div>'+
    '</div>'+
    '<button class="detail-toggle" onclick="toggleInsights()">'+(insightsExpanded?'Hide detail \u25b4':'Show full detail \u25be')+'</button>'+
    (insightsExpanded ? renderInsightDetail(rows, s) : '');

  el.innerHTML =
    '<div class="panel">'+
      '<div class="panel-title">Coaching Insights <span>this week \u00b7 headline view \u2014 expand for the full breakdown</span></div>'+
      tiles+
    '</div>';
}

// Expanded detail — the former "busy" panels, now opt-in and week-scoped.
function renderInsightDetail(rows, s){
  const cfg = {color:s.color};
  const vm = rows.filter(function(r){return r['Mark %']!=null;});
  const byDir = groupBy(vm, function(r){return r.Directive||'Unknown';});
  const dirs = Object.entries(byDir).map(function(e){return {label:e[0], val:avg(e[1].map(function(r){return r['Mark %'];})), count:e[1].length};})
    .sort(function(a,b){return a.val-b.val;}).slice(0,8);  // weakest first — teach these
  function compPct(rows, scoreCol, maxCol) {
    const valid = rows.filter(function(r){ return r[scoreCol] != null && !isNaN(r[scoreCol]); });
    if (!valid.length) return null;
    return avg(valid.map(function(r){
      const mx = (r[maxCol] != null && !isNaN(r[maxCol]) && r[maxCol] > 0) ? r[maxCol] : 5;
      return Math.min(r[scoreCol], mx) / mx;
    }));
  }
  const wi=[
    ['Causal Connectives',       compPct(rows,'W-Con','W-Con Max'),   '#4fc3f7'],
    ['Complex Noun Groups',      compPct(rows,'W-Noun','W-Noun Max'), '#a78bfa'],
    ['Modality',                 compPct(rows,'W-Mod','W-Mod Max'),   '#e8a030'],
    ['Logical Flow & Structure', compPct(rows,'W-Flow','W-Flow Max'), '#43d9ad'],
  ].filter(function(x){return x[1]!=null&&!isNaN(x[1]);});
  const mcCounts={}; rows.forEach(function(r){const m=normM(r['Mission Category']);mcCounts[m]=(mcCounts[m]||0)+1;});
  const FOCUS_ORDER=['Causal Connectives','Complex Noun Groups','Modality','Logical Flow & Structure'];
  const me=FOCUS_ORDER.filter(function(k){return mcCounts[k]>0;}).map(function(k){return [k,mcCounts[k]];});
  const maxM=me.length>0?Math.max.apply(null,me.map(function(e){return e[1];})):1;
  const legibilityCount=mcCounts['Legibility of handwritten response']||0;
  const cubeRows=rows.filter(function(r){return r['CUBE XP']!=null;});
  const cubeAttempted=cubeRows.filter(function(r){return r['CUBE XP']>0;}).length;
  const cubePctAttempt=cubeRows.length>0?cubeAttempted/cubeRows.length:0;
  const cA=avg(rows.filter(function(r){return r['CUBE %']!=null;}).map(function(r){return r['CUBE %'];}));
  const aR=rows.filter(function(r){return r['Anno Ideas']!=null&&r['Anno Used']!=null;});
  const tI=aR.reduce(function(sum,r){return sum+(r['Anno Ideas']||0);},0);
  const tU=aR.reduce(function(sum,r){return sum+(r['Anno Used']||0);},0);
  const ar=tI>0?tU/tI:0;
  const annoSubmissions=aR.filter(function(r){return (r['Anno Ideas']||0)>0;}).length;
  const bigStat = function(label, value, sub, color){
    return '<div style="margin-bottom:1rem">'+
      '<div style="font-size:0.66rem;color:var(--text-dim);margin-bottom:0.35rem;text-transform:uppercase;letter-spacing:0.1em;font-family:\'IBM Plex Mono\',monospace">'+label+'</div>'+
      '<div style="display:flex;align-items:center;gap:0.75rem"><div style="font-family:\'Helvetica Neue\',Helvetica,Arial,sans-serif;font-size:1.4rem;font-weight:800;color:'+color+'">'+value+'</div>'+
      '<div style="font-size:0.72rem;color:var(--text-dim);line-height:1.35">'+sub+'</div></div></div>';
  };
  return '<div class="grid-2" style="margin-top:1rem;margin-bottom:0">'+
    '<div>'+
      '<div class="panel-title" style="font-size:0.72rem">Avg Mark % by Directive <span>weakest first</span></div>'+
      '<div class="bar-chart" style="margin-bottom:1.25rem">'+dirs.map(function(d){
        return '<div class="bar-row"><div class="bar-label" title="'+esc(d.label)+'">'+esc(d.label)+'</div>'+
          '<div class="bar-track"><div class="bar-fill" style="width:'+(d.val*100)+'%;background:'+cfg.color+'"></div></div>'+
          '<div class="bar-val">'+pct(d.val)+' <span style="color:var(--text-dim);font-size:0.6rem">('+d.count+')</span></div></div>';
      }).join('')+'</div>'+
      '<div class="panel-title" style="font-size:0.72rem">Writing Components <span>% of max</span></div>'+
      '<div class="bar-chart" style="margin-bottom:1.25rem">'+(wi.length?wi.map(function(x){
        return '<div class="bar-row"><div class="bar-label">'+x[0]+'</div>'+
          '<div class="bar-track"><div class="bar-fill" style="width:'+(x[1]*100)+'%;background:'+x[2]+'"></div></div>'+
          '<div class="bar-val">'+pct(x[1])+'</div></div>';
      }).join(''):'<div class="no-data" style="padding:0.5rem 0">No writing component data this week</div>')+'</div>'+
      '<div class="panel-title" style="font-size:0.72rem">Literacy Focus Areas <span>higher = more coaching needed</span></div>'+
      (me.length===0?'<div class="no-data" style="padding:0.5rem 0">No literacy focus data this week</div>':
      '<div class="mission-freq">'+me.map(function(e){
        return '<div class="mission-row"><div class="mission-name">'+e[0]+'</div>'+
          '<div class="mission-bar-track"><div class="mission-bar-fill" style="width:'+((e[1]/maxM)*100)+'%;background:'+(MCOL[e[0]]||'#6b7599')+'"></div></div>'+
          '<div class="mission-count">'+e[1]+'</div></div>';
      }).join('')+'</div>')+
    '</div>'+
    '<div>'+
      '<div class="panel-title" style="font-size:0.72rem">Question Deconstruction with CUBE</div>'+
      bigStat('CUBE attempted', Math.round(cubePctAttempt*100)+'%', 'of submissions had CUBE markings', '#4fc3f7')+
      bigStat('CUBE effectiveness', pct(cA), 'avg accuracy of CUBE markings', '#4fc3f7')+
      (aR.length===0?'<div class="no-data" style="padding:0.5rem 0">No annotation data this week</div>':
        bigStat('Questions annotated', annoSubmissions, 'of '+aR.length+' submissions had planning notes', '#c9a84c')+
        bigStat('Annotations used', pct(ar), 'of annotated ideas used in the written response', '#c9a84c'))+
      bigStat('Handwriting clarity', legibilityCount,
        legibilityCount===0?'of '+rows.length+' submissions flagged \u2014 good handwriting across the class'
                           :'of '+rows.length+' submissions flagged as priority for improvement',
        legibilityCount>0?'#ff6b6b':'#43d9ad')+
    '</div>'+
  '</div>';
}

// 4 · ACCORDIONS — band distribution + submission log (default collapsed) ----
function accordion(id, title, sub, bodyHtml, open){
  return '<div class="accordion'+(open?' open':'')+'" id="'+id+'">'+
    '<button class="acc-head" onclick="toggleAccordion(\''+id+'\')">'+title+
      '<span class="acc-sub">'+sub+'</span><span class="acc-chev">\u25be</span></button>'+
    '<div class="acc-body">'+bodyHtml+'</div></div>';
}
function toggleAccordion(id){
  const el = document.getElementById(id);
  if(el) el.classList.toggle('open');
}

function renderBandAccordion(s){
  const el = document.getElementById('acc-band');
  const rows = saRowsAll();  // cumulative — band attainment is not a weekly metric
  function bandLabel(v){
    if(v==null) return null;
    var str=String(v).trim();
    if(/^E[1-4]$/i.test(str)) return 'Band '+str.toUpperCase();
    var n=Number(str);
    if(!isNaN(n) && Math.abs(n-Math.round(n))<1e-9){ n=Math.round(n); if(n>=1&&n<=6) return 'Band '+n; }
    return null;
  }
  var counts={};
  rows.forEach(function(r){ var b=bandLabel(r['Ind Band']); if(b) counts[b]=(counts[b]||0)+1; });
  var labels=Object.keys(counts);
  if(!labels.length){ el.innerHTML=''; return; }
  var total=labels.reduce(function(a,k){return a+counts[k];},0);
  function rank(l){ var m=l.replace('Band ',''); return /^E/i.test(m)?Number(m.slice(1)):Number(m); }
  labels.sort(function(a,b){return rank(b)-rank(a);});
  var maxC=Math.max.apply(null,labels.map(function(k){return counts[k];}));
  const body =
    '<div class="bar-chart">'+labels.map(function(k){
      var c=counts[k], p=Math.round(c/total*100);
      return '<div class="bar-row"><div class="bar-label" title="'+k+'">'+k+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+(c/maxC*100)+'%;background:'+s.color+'"></div></div>'+
        '<div class="bar-val">'+c+' <span style="color:var(--text-dim)">('+p+'%)</span></div></div>';
    }).join('')+'</div>'+
    '<div style="font-size:0.72rem;color:var(--text-dim);line-height:1.4;margin-top:0.85rem">'+
      'Band-marked responses are assessed holistically against NESA performance-band descriptors, '+
      'so they are shown as a distribution here and are <strong>not</strong> included in the Mark&nbsp;% averages above.'+
    '</div>';
  const wasOpen = el.querySelector('.accordion.open') !== null;
  el.innerHTML = accordion('band-acc', 'HSC Band Distribution', total+' band-marked response'+(total!==1?'s':'')+' \u00b7 all time', body, wasOpen);
}

  const body =
    '<div style="overflow-x:auto"><table class="student-table">'+
      '<thead><tr><th>Student</th><th class="hide-xs">Q No</th><th>Directive</th><th class="hide-xs">Syllabus Keywords</th><th>Mark</th><th class="hide-xs">CUBE %</th><th class="hide-xs">Write %</th><th class="hide-xs">Literacy Focus</th><th>Band</th></tr></thead>'+
      '<tbody>'+tr.map(function(r){
        return '<tr><td style="font-weight:600">'+esc(r.Student)+'</td>'+
          '<td class="mono hide-xs" style="font-size:0.7rem">'+esc(r['Q No']||'\u2014')+'</td>'+
          '<td>'+esc(r.Directive||'\u2014')+'</td>'+
          '<td class="hide-xs" style="font-size:0.7rem;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(r['Syllabus Kw']||'')+'">'+esc(r['Syllabus Kw']||'\u2014')+'</td>'+
          '<td class="mono">'+(r['Awd Mark']!=null?esc(r['Awd Mark']):'\u2014')+'/'+esc(r['Q Marks']||'\u2014')+'</td>'+
          '<td class="mono hide-xs">'+(r['CUBE %']!=null?pct(r['CUBE %']):'\u2014')+'</td>'+
          '<td class="mono hide-xs">'+(r['Write %']!=null?pct(r['Write %']):'\u2014')+'</td>'+
          '<td class="hide-xs" style="font-size:0.72rem">'+esc(normM(r['Mission Category']))+'</td>'+
          '<td>'+bandCell(r)+'</td></tr>';
      }).join('')+'</tbody></table></div>'+
    (all.length>10 ? '<button class="show-all-btn" onclick="toggleLog()">'+(logExpanded?'Show recent 10 only':'Show all '+Math.min(all.length,100)+' entries')+'</button>' : '');
  const wasOpen = el.querySelector('.accordion.open') !== null;
  el.innerHTML = accordion('log-acc', 'Submission Log', 'most recent '+tr.length+' of '+all.length+' \u00b7 all time', body, wasOpen);
}
function toggleLog(){
  logExpanded = !logExpanded;
  const s = subjEntry(activeSubj); if(!s) return;
  renderLogAccordion(s);
  const acc=document.getElementById('log-acc'); if(acc) acc.classList.add('open');
}

// 5 · MC DETAIL (behind the toggle) ------------------------------------------
function renderMCDetail(s){
  const panel = document.getElementById('mc-detail');
  const weekRows = filterByWeek(mcRowsAll(), weekOffset);
  if(!weekRows.length){
    panel.innerHTML = '<div class="panel" style="text-align:center;padding:2rem"><div style="color:var(--text-dim);font-size:0.85rem">No MC data this week for '+esc(s.full)+'.<br>Data will appear as students complete MC sessions.</div></div>';
    return;
  }
  var total    = weekRows.length;
  var correct  = weekRows.filter(function(r){return mcIsCorrect(r);}).length;
  var accuracy = total ? correct/total : 0;
  var students = Object.keys(groupBy(weekRows.filter(function(r){return r.Student;}), function(r){return r.Student;})).length;
  var totalXP  = weekRows.reduce(function(sum,r){return sum+(Number(r['XP Earned'])||0);},0);
  var byMod = {};
  weekRows.forEach(function(r){
    var m = r.Module || r.module || '\u2014';
    if(!byMod[m]) byMod[m] = {total:0,correct:0};
    byMod[m].total++;
    if(mcIsCorrect(r)) byMod[m].correct++;
  });
  var modStats = Object.entries(byMod).map(function(e){
    return {module:e[0],total:e[1].total,correct:e[1].correct,acc:e[1].total?e[1].correct/e[1].total:0};
  }).sort(function(a,b){return a.acc-b.acc;});
  var refCounts = {guessed:0,misread:0,noknowledge:0};
  weekRows.forEach(function(r){
    var rt = String(r['Reflection Type']||r.reflectionType||'').toLowerCase();
    if(rt==='guessed') refCounts.guessed++;
    else if(rt==='misread') refCounts.misread++;
    else if(rt==='noknowledge') refCounts.noknowledge++;
  });
  var wrongTotal = refCounts.guessed + refCounts.misread + refCounts.noknowledge;
  var qMiss = {};
  weekRows.forEach(function(r){
    if(mcIsCorrect(r)) return;
    var id = r['Question ID']||r.questionId||'\u2014';
    var txt = r['Question Text']||r.questionText||id;
    if(!qMiss[id]) qMiss[id]={id:id,text:txt,count:0};
    qMiss[id].count++;
  });
  var missedQ = Object.values(qMiss).sort(function(a,b){return b.count-a.count;}).slice(0,8);
  var errBar = function(icon,label,count,color){
    return '<div class="bar-row"><div class="bar-label">'+icon+' '+label+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+(wrongTotal?count/wrongTotal*100:0)+'%;background:'+color+'"></div></div>'+
      '<div class="bar-val">'+count+'</div></div>';
  };
  var logRows = weekRows.slice().reverse();
  var shown = mcLogExpanded ? logRows.slice(0,100) : logRows.slice(0,10);
  var logBody =
    '<div style="overflow-x:auto"><table class="student-table">'+
      '<thead><tr><th>Student</th><th class="hide-xs">Module</th><th class="hide-xs">Year</th><th>Question</th><th>Ans</th><th>\u2713/\u2717</th><th class="hide-xs">Reflection</th><th>XP</th></tr></thead>'+
      '<tbody>'+shown.map(function(r){
        var ok = mcIsCorrect(r);
        var qt = String(r['Question Text']||'\u2014');
        return '<tr><td style="font-weight:600">'+esc(r.Student||'\u2014')+'</td>'+
          '<td class="mono hide-xs" style="font-size:0.7rem">'+esc(r.Module||r.module||'\u2014')+'</td>'+
          '<td class="hide-xs" style="font-size:0.7rem">'+esc(r.Year||r.year||'\u2014')+'</td>'+
          '<td style="font-size:0.68rem;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(qt)+'">'+esc(qt.slice(0,60))+(qt.length>60?'\u2026':'')+'</td>'+
          '<td class="mono">'+esc(r['Student Answer']||r.studentAnswer||'\u2014')+'</td>'+
          '<td style="color:'+(ok?'var(--green)':'var(--red)')+';font-weight:700">'+(ok?'\u2713':'\u2717')+'</td>'+
          '<td class="hide-xs" style="font-size:0.68rem">'+esc(r['Reflection Type']||r.reflectionType||'\u2014')+'</td>'+
          '<td class="mono">'+esc(r['XP Earned']||'0')+'</td></tr>';
      }).join('')+'</tbody></table></div>'+
    (logRows.length>10 ? '<button class="show-all-btn" onclick="toggleMCLog()">'+(mcLogExpanded?'Show recent 10 only':'Show all '+Math.min(logRows.length,100)+' entries')+'</button>' : '');

  panel.innerHTML =
    '<div class="insight-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:1.25rem">'+
      '<div class="insight-tile"><div class="tile-label">MC Attempts</div><div class="tile-value">'+total+'</div>'+
        '<div class="tile-sub">'+students+' student'+(students!==1?'s':'')+' this week</div></div>'+
      '<div class="insight-tile"><div class="tile-label">Accuracy</div>'+
        '<div class="tile-value '+(accuracy>=0.75?'clr-green':accuracy>=0.5?'clr-amber':'clr-red')+'">'+pct(accuracy)+'</div>'+
        '<div class="tile-sub">'+correct+' of '+total+' correct</div></div>'+
      '<div class="insight-tile"><div class="tile-label">MC XP Earned</div><div class="tile-value clr-green">'+totalXP+'</div>'+
        '<div class="tile-sub">this week</div></div>'+
      '<div class="insight-tile"><div class="tile-label">Guessing Rate</div>'+
        '<div class="tile-value '+(wrongTotal>0?'clr-amber':'clr-green')+'">'+(wrongTotal>0?pct(refCounts.guessed/wrongTotal):'\u2014')+'</div>'+
        '<div class="tile-sub">of wrong answers were guesses</div></div>'+
    '</div>'+
    '<div class="grid-2 mb">'+
      '<div class="panel">'+
        '<div class="panel-title">Accuracy by Module <span>lowest first \u2014 focus teaching here</span></div>'+
        '<div class="bar-chart">'+modStats.map(function(m){
          return '<div class="bar-row"><div class="bar-label">'+esc(m.module)+'</div>'+
            '<div class="bar-track"><div class="bar-fill" style="width:'+(m.acc*100)+'%;background:'+(m.acc<0.5?'#ff6b6b':m.acc<0.75?'#e8a030':s.color)+'"></div></div>'+
            '<div class="bar-val">'+pct(m.acc)+' <span style="color:var(--text-dim);font-size:0.65rem">('+m.total+')</span></div></div>';
        }).join('')+'</div>'+
        '<div class="panel-title" style="font-size:0.72rem;margin-top:1.25rem;margin-bottom:0.75rem">Error patterns (wrong answers only)</div>'+
        (wrongTotal===0?'<div class="no-data">No wrong answers this week</div>':
        '<div class="bar-chart">'+
          errBar('\ud83c\udfb2','Guessing',refCounts.guessed,'#e8a030')+
          errBar('\ud83d\udcda','Didn\u2019t know',refCounts.noknowledge,'#ff6b6b')+
          errBar('\ud83d\udc41','Misread',refCounts.misread,'#a78bfa')+
        '</div>')+
      '</div>'+
      '<div class="panel">'+
        '<div class="panel-title">Most Missed Questions <span>this week</span></div>'+
        (missedQ.length===0?'<div class="no-data">No missed questions this week</div>':
        '<div style="display:flex;flex-direction:column;gap:0.5rem">'+missedQ.map(function(q,i){
          var t = String(q.text);
          return '<div style="display:flex;gap:0.5rem;align-items:flex-start">'+
            '<span class="mono" style="font-size:0.6rem;color:var(--text-dim);flex-shrink:0;padding-top:0.15rem">'+(i+1)+'</span>'+
            '<span style="font-size:0.7rem;line-height:1.4;flex:1" title="'+esc(t)+'">'+esc(t.slice(0,80))+(t.length>80?'\u2026':'')+'</span>'+
            '<span class="mono" style="font-size:0.68rem;color:#ff6b6b;flex-shrink:0;font-weight:700">'+q.count+' wrong</span></div>';
        }).join('')+'</div>')+
      '</div>'+
    '</div>'+
    accordion('mc-log-acc','MC Attempt Log','most recent '+shown.length+' of '+logRows.length+' \u00b7 this week',logBody,mcLogExpanded);
}
function toggleMCLog(){
  mcLogExpanded = !mcLogExpanded;
  const s = subjEntry(activeSubj); if(!s) return;
  renderMCDetail(s);
  const acc=document.getElementById('mc-log-acc'); if(acc) acc.classList.add('open');
}

// ── STARTUP ──────────────────────────────────────────────
async function boot(){
  showScreen('loading');
  try {
    SCOPE = await fetchScope();
    applyScope();
    if(!VISIBLE.length){
      throw new Error('Your key\u2019s subjects are not in this dashboard\u2019s registry \u2014 contact the CUBE administrator.');
    }
    await loadSheets();
  } catch(e){
    setDot('err', e.message);
    document.getElementById('errmsg').textContent = e.message;
    showScreen('error');
  }
}
boot();
