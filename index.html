\<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-analysis-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-analysis-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUBE Marking Coach - Effectiveness Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #040d18;
  --navy-mid: #0a1628;
  --surface: #0e1e34;
  --surface2: #141e30;
  --border: rgba(255,255,255,0.08);
  --border-gold: rgba(201,168,76,0.3);
  --text: #e8eaf0;
  --text-dim: #7a9ab8;
  --gold: #c9a84c;
  --gold-light: #e8c96a;
  --green: #43d9ad;
  --red: #ff6b6b;
  --ees:   #4fc3f7;
  --engs:  #e8a030;
  --buss:  #a78bfa;
  --hltm:  #43d9ad;
  --comfam:#f472b6;
  --bio:   #a5d6a7;
  --legal: #ce93d8;
  --va:    #f48fb1;
  --anch:  #ffcc80;
  --phys:  #7986cb;
  --mhist: #ef9a9a;
  --econ:  #ffd54f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.025'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}

/* HEADER */
header {
  padding: 1.5rem 2.5rem;
  border-bottom: 1px solid var(--border);
  background: rgba(4,13,24,0.96);
  backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 50;
}
/* eyebrow matches "HOW IT WORKS" — Helvetica Neue 700 uppercase */
.eyebrow {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 0.62rem; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 0.3rem;
}
/* h1 matches hero "Get instant feedback" — Helvetica Neue 800 */
h1 {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 1.75rem; font-weight: 800; line-height: 1.1; color: var(--text);
}
h1 span { color: var(--gold); }
.header-right { display:flex; flex-direction:column; align-items:flex-end; gap:0.5rem; }
.btn-refresh {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  color: #040d18; border: none; padding: 0.55rem 1.25rem;
  border-radius: 8px; cursor: pointer; font-weight: 700;
  box-shadow: 0 4px 16px rgba(201,168,76,0.25);
  transition: opacity 0.2s;
}
.btn-refresh:hover { opacity: 0.85; }
.btn-research {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
  background: linear-gradient(135deg, #e8621a, #f0873a);
  color: #ffffff; border: none; padding: 0.55rem 1.25rem;
  border-radius: 8px; cursor: pointer; font-weight: 700;
  box-shadow: 0 4px 16px rgba(232,98,26,0.35);
  transition: opacity 0.2s; text-decoration: none; display: inline-block;
}
.btn-research:hover { opacity: 0.85; }
.status-line { font-size: 0.7rem; color: var(--text-dim); display:flex; align-items:center; gap:0.4rem; }
.dot { width:7px; height:7px; border-radius:50%; background:var(--text-dim); display:inline-block; flex-shrink:0; }
.dot.live { background:var(--green); box-shadow:0 0 6px var(--green); }
.dot.err  { background:var(--red); }

/* SUBJECT SELECTOR */
#subject-selector {
  padding: 2rem 2.5rem;
  border-bottom: 1px solid var(--border);
  background: var(--navy-mid);
}
.selector-label {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 0.65rem; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 1.25rem;
}
.subject-grid {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 1rem;
}
/* PDHPE box contains two clickable sub-rows */
.pdhpe-box {
  background: linear-gradient(135deg, var(--surface), var(--navy-mid));
  border: 1.5px solid rgba(240,192,48,0.7);
  border-radius: 16px; padding: 1rem 1.5rem;
  display: flex; flex-direction: column; gap: 0.5rem;
  transition: border-color 0.25s, box-shadow 0.25s;
}
/* Science box — EES + Biology sub-rows */
.science-box {
  background: linear-gradient(135deg, var(--surface), var(--navy-mid));
  border: 1.5px solid rgba(240,192,48,0.7);
  border-radius: 16px; padding: 1rem 1.5rem;
  display: flex; flex-direction: column; gap: 0.5rem;
  transition: border-color 0.25s, box-shadow 0.25s;
}
/* HSIE box — BusS + Legal sub-rows */
.hsie-box {
  background: linear-gradient(135deg, var(--surface), var(--navy-mid));
  border: 1.5px solid rgba(240,192,48,0.7);
  border-radius: 16px; padding: 1rem 1.5rem;
  display: flex; flex-direction: column; gap: 0.5rem;
  transition: border-color 0.25s, box-shadow 0.25s;
}
.pdhpe-kla-tag {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--hltm); margin-bottom: 0.15rem;
}
.science-kla-tag {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--ees); margin-bottom: 0.15rem;
}
.hsie-kla-tag {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--buss); margin-bottom: 0.15rem;
}
.pdhpe-subj { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.6rem; border-radius: 10px; cursor: pointer; transition: background 0.18s; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 0.9rem; font-weight: 700; color: var(--text); }
.pdhpe-subj:hover { background: rgba(255,255,255,0.06); }
.pdhpe-subj.active-hltm  { background: rgba(67,217,173,0.15);  color:#43d9ad; }
.pdhpe-subj.active-comfam{ background: rgba(244,114,182,0.15); color:#f472b6; }
.multi-subj { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.6rem; border-radius: 10px; cursor: pointer; transition: background 0.18s; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--text); }
.multi-subj:hover { background: rgba(255,255,255,0.06); }
.multi-subj.active-ees    { background: rgba(79,195,247,0.15);  color:#4fc3f7; }
.multi-subj.active-bio1   { background: rgba(165,214,167,0.15); color:#a5d6a7; }
.multi-subj.active-bio2   { background: rgba(165,214,167,0.15); color:#a5d6a7; }
.multi-subj.active-bio3   { background: rgba(165,214,167,0.15); color:#a5d6a7; }
.multi-subj.active-bio4   { background: rgba(165,214,167,0.15); color:#a5d6a7; }
.multi-subj.active-buss   { background: rgba(167,139,250,0.15); color:#a78bfa; }
.multi-subj.active-leg1   { background: rgba(206,147,216,0.15); color:#ce93d8; }
.multi-subj.active-leg2   { background: rgba(206,147,216,0.15); color:#ce93d8; }
.multi-divider { height:1px; background:rgba(255,255,255,0.07); margin:2px 0; }
.multi-sublabel { font-size:0.55rem; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:var(--bio); padding: 0 0.6rem; margin-top:2px; }
.multi-sublabel.legal { color:var(--legal); }
.multi-sublabel.va    { color:var(--va); }
.multi-subj.active-va1 { background: rgba(244,143,177,0.15); color:#f48fb1; }
.multi-subj.active-va2 { background: rgba(244,143,177,0.15); color:#f48fb1; }
.multi-subj.active-ahis { background: rgba(255,204,128,0.15); color:#ffcc80; }
.pdhpe-count { font-family:'IBM Plex Mono',monospace; font-size:0.6rem; color:#f0c030; margin-left:auto; font-weight:700; }
.multi-count { font-family:'IBM Plex Mono',monospace; font-size:0.55rem; color:#f0c030; margin-left:auto; font-weight:700; }
.subject-box {
  background: linear-gradient(135deg, var(--surface), var(--navy-mid));
  border: 1.5px solid rgba(240,192,48,0.7);
  border-radius: 16px; padding: 1.25rem 1.5rem;
  cursor: pointer;
  transition: border-color 0.25s, transform 0.2s, background 0.25s;
}
.subject-box.active .subj-name { color: #ffffff; }
.subject-box.active .kla-tag::after {
  content: ' · SELECTED';
  font-size: 0.55rem;
  opacity: 0.85;
  letter-spacing: 0.12em;
}
.subject-box { transition: border-color 0.25s, transform 0.2s, background 0.25s, box-shadow 0.25s; }
.subject-box:hover { border-color: #f0c030; transform: translateY(-2px); }
.subject-box.active[data-kla="EES"]   {
  border-color: var(--ees); border-width: 2.5px;
  background: linear-gradient(135deg, rgba(79,195,247,0.22), rgba(79,195,247,0.10));
  box-shadow: 0 0 0 3px rgba(79,195,247,0.18), 0 6px 24px rgba(79,195,247,0.15);
  transform: translateY(-3px) scale(1.02);
}
.subject-box.active[data-kla="EngS"]  {
  border-color: var(--engs); border-width: 2.5px;
  background: linear-gradient(135deg, rgba(232,160,48,0.22), rgba(232,160,48,0.10));
  box-shadow: 0 0 0 3px rgba(232,160,48,0.18), 0 6px 24px rgba(232,160,48,0.15);
  transform: translateY(-3px) scale(1.02);
}
.subject-box.active[data-kla="BusS"]  {
  border-color: var(--buss); border-width: 2.5px;
  background: linear-gradient(135deg, rgba(167,139,250,0.22), rgba(167,139,250,0.10));
  box-shadow: 0 0 0 3px rgba(167,139,250,0.18), 0 6px 24px rgba(167,139,250,0.15);
  transform: translateY(-3px) scale(1.02);
}
.subject-box.active[data-kla="HlthM"] {
  border-color: var(--hltm); border-width: 2.5px;
  background: linear-gradient(135deg, rgba(67,217,173,0.22), rgba(67,217,173,0.10));
  box-shadow: 0 0 0 3px rgba(67,217,173,0.18), 0 6px 24px rgba(67,217,173,0.15);
  transform: translateY(-3px) scale(1.02);
}
.subject-box.active[data-kla="ComFam"] {
  border-color: var(--comfam); border-width: 2.5px;
  background: linear-gradient(135deg, rgba(244,114,182,0.22), rgba(244,114,182,0.10));
  box-shadow: 0 0 0 3px rgba(244,114,182,0.18), 0 6px 24px rgba(244,114,182,0.15);
  transform: translateY(-3px) scale(1.02);
}
.subject-box[data-kla="ComFam"] .kla-tag { color: var(--comfam); }
.subject-box[data-kla="EES"]   .kla-tag { color: var(--ees); }
.subject-box[data-kla="EngS"]  .kla-tag { color: var(--engs); }
.subject-box[data-kla="BusS"]  .kla-tag { color: var(--buss); }
.subject-box[data-kla="HlthM"] .kla-tag { color: var(--hltm); }
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.15em; text-transform: uppercase;
  margin-bottom: 0.35rem;
}
.subject-box[data-kla="EES"]   .kla-tag { color: var(--ees); }
.subject-box[data-kla="EngS"]  .kla-tag { color: var(--engs); }
.subject-box[data-kla="BusS"]  .kla-tag { color: var(--buss); }
.subject-box[data-kla="HlthM"] .kla-tag { color: var(--hltm); }
.subj-name {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 1rem; font-weight: 700; color: var(--text);
  display: flex; align-items: center; gap: 0.5rem;
}
.subj-count { font-family:'IBM Plex Mono',monospace; font-size:0.65rem; color:#f0c030; margin-top:0.25rem; font-weight:700; }

/* MAIN */
main { padding: 1.75rem 2.5rem; }

/* LOADING */
#loading-screen { display:none; text-align:center; padding:5rem 2rem; }
.spinner { width:36px; height:36px; border:2px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 1rem; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ERROR */
#error-screen { display:none; text-align:center; padding:4rem 2rem; }
.error-box { max-width:520px; margin:0 auto; background:rgba(255,107,107,0.07); border:1px solid rgba(255,107,107,0.25); border-radius:12px; padding:2rem; }
.error-title { font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-weight:800; font-size:1rem; color:var(--red); margin-bottom:0.75rem; }
.error-msg { font-size:0.82rem; color:var(--text-dim); line-height:1.7; }

/* DASHBOARD */
#dashboard { display:none; }
.stats-row { display:grid; grid-template-columns:repeat(5,1fr); gap:1rem; margin-bottom:1.5rem; }
.stat-card {
  background: linear-gradient(135deg, var(--surface), var(--navy-mid));
  border: 1px solid var(--border-gold); border-radius: 10px;
  padding: 1rem 1.2rem; position: relative; overflow: hidden;
}
.stat-card::before { content:''; position:absolute; top:0;left:0;right:0;height:2px; }
.stat-card.c-ees::before   { background:var(--ees); }
.stat-card.c-engs::before  { background:var(--engs); }
.stat-card.c-buss::before  { background:var(--buss); }
.stat-card.c-hltm::before  { background:var(--hltm); }
.stat-card.c-comfam::before{ background:var(--comfam); }
.stat-card.c-bio::before   { background:var(--bio); }
.stat-card.c-legal::before { background:var(--legal); }
.stat-card.c-va::before    { background:var(--va); }
.stat-card.c-anch::before  { background:var(--anch); }
.stat-card.c-phys::before  { background:var(--phys); }
.stat-card.c-mhist::before { background:var(--mhist); }
.stat-card.c-econ::before  { background:var(--econ); }
.stat-card.c-neutral::before { background:var(--gold); }
.stat-label { font-family:'IBM Plex Mono',monospace; font-size:0.56rem; letter-spacing:0.15em; text-transform:uppercase; color:#e8eaf0; margin-bottom:0.4rem; }
.stat-value { font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; font-size:2rem; font-weight:800; line-height:1; }
.stat-value.good { color:var(--green); }
.stat-value.warn { color:var(--gold); }
.stat-value.low  { color:var(--red); }
.stat-sub { font-size:0.7rem; color:#c8d8e8; margin-top:0.2rem; }

.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; margin-bottom:1.25rem; }
.mb { margin-bottom:1.25rem; }

.panel {
  background: linear-gradient(135deg, var(--surface), var(--navy-mid));
  border: 1px solid var(--border-gold); border-radius: 12px; padding: 1.25rem;
}
.panel-title {
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size:0.87rem; font-weight:700; letter-spacing:0.15em; text-transform:uppercase;
  color:#f0c030; margin-bottom:1rem; padding-bottom:0.55rem;
  border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;
}
.panel-title span { color:#ffffff; font-weight:600; }

.bar-chart { display:flex; flex-direction:column; gap:0.55rem; }
.bar-row { display:flex; align-items:center; gap:0.7rem; }
.bar-label { font-size:0.82rem; width:160px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#e8eaf0; }
.bar-track { flex:1; height:5px; background:rgba(255,255,255,0.05); border-radius:3px; overflow:hidden; }
.bar-fill { height:100%; border-radius:3px; transition:width 0.9s cubic-bezier(0.4,0,0.2,1); }
.bar-val { font-family:'IBM Plex Mono',monospace; font-size:0.68rem; width:38px; text-align:right; color:#e8eaf0; }

.mission-freq { display:flex; flex-direction:column; gap:0.5rem; }
.mission-row { display:flex; align-items:center; gap:0.75rem; }
.mission-name { font-size:0.78rem; width:180px; flex-shrink:0; color:#e8eaf0; }
.mission-bar-track { flex:1; height:5px; background:rgba(255,255,255,0.05); border-radius:3px; overflow:hidden; }
.mission-bar-fill { height:100%; border-radius:3px; }
.mission-count { font-family:'IBM Plex Mono',monospace; font-size:0.65rem; color:#ffffff; width:24px; text-align:right; font-weight:700; }

.example-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:0.75rem; }
.example-card { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-left:3px solid var(--border); border-radius:10px; padding:0.9rem 1rem; }
.example-card.fix-causal { border-left-color:#4fc3f7; }
.example-card.fix-noun   { border-left-color:#a78bfa; }
.example-card.fix-flow   { border-left-color:#43d9ad; }
.example-card.fix-mod    { border-left-color:#e8a030; }
.example-card.fix-other  { border-left-color:#6b7599; }
.ex-label { font-family:'IBM Plex Mono',monospace; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; color:#e8eaf0; margin-bottom:0.35rem; font-weight:600; }
.ex-before { font-size:0.77rem; color:var(--red); margin-bottom:0.3rem; }
.ex-before::before { content:'✗ '; }
.ex-after  { font-size:0.77rem; color:var(--green); }
.ex-after::before  { content:'✓ '; }
.ex-kw { font-size:0.72rem; color:#c8d8e8; margin-top:0.3rem; font-style:italic; }

.student-table { width:100%; border-collapse:collapse; font-size:0.78rem; }
.student-table th { font-family:'IBM Plex Mono',monospace; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; color:#e8eaf0; text-align:left; padding:0.45rem 0.7rem; border-bottom:1px solid var(--border); font-weight:700; }
.student-table td { padding:0.5rem 0.7rem; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle; }
.student-table tr:last-child td { border-bottom:none; }
.student-table tr:hover td { background:rgba(201,168,76,0.04); }
.pill { display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:0.58rem; letter-spacing:0.06em; padding:0.15rem 0.5rem; border-radius:20px; }
.pill.high { background:rgba(67,217,173,0.15); color:var(--green);  border:1px solid rgba(67,217,173,0.3); }
.pill.mid  { background:rgba(201,168,76,0.15);  color:var(--gold);   border:1px solid rgba(201,168,76,0.3); }
.pill.low  { background:rgba(255,107,107,0.15); color:var(--red);    border:1px solid rgba(255,107,107,0.3); }
.no-data { text-align:center; padding:2rem; color:var(--text-dim); font-size:0.82rem; font-style:italic; }

.week-nav{display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem;background:rgba(255,255,255,0.03);border:1px solid rgba(201,168,76,0.3);border-radius:10px;padding:0.7rem 1.2rem;}
.week-nav-btn{background:rgba(201,168,76,0.18);border:2px solid rgba(201,168,76,0.55);color:var(--gold-light);border-radius:8px;padding:0.4rem 1rem;cursor:pointer;font-size:1.1rem;font-weight:900;transition:all 0.15s;line-height:1;letter-spacing:0.05em;}
.week-nav-btn:hover{background:rgba(201,168,76,0.35);border-color:var(--gold-light);color:#fff;}
.week-nav-btn:disabled{opacity:0.25;cursor:default;}
.week-label{font-family:'IBM Plex Mono',monospace;font-size:1rem;letter-spacing:0.06em;color:#ffffff;flex:1;text-align:center;font-weight:700;}
.week-badge{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.3);color:var(--gold);border-radius:20px;padding:0.2rem 0.6rem;}
.trophy-banner{background:linear-gradient(135deg,rgba(201,168,76,0.12),rgba(201,168,76,0.05));border:1px solid rgba(201,168,76,0.35);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem;}

const MCOL = {
  'Complex Noun Groups':'#a78bfa','complexNounGroups':'#a78bfa','complexnoungroups':'#a78bfa',

let klaData = {}, mcData = {}, activeKLA = null, activeView = 'sa'; // sa = short answer, mc = multiple choice
let loadFailed = new Set();  // tabs whose fetch failed (≠ empty) — retried before counts render
let weekOffset = 0;

function getWeekBounds(offset) {
  // Week runs from Friday 3pm AEST to the following Friday 3pm AEST.
  // Find the most recent Friday 3pm AEST as the START of the current week.
  var now = new Date();
  var aestNow = new Date(now.getTime() + 10 * 3600 * 1000);
  var day = aestNow.getUTCDay();         // 0=Sun .. 5=Fri .. 6=Sat
  var hourFrac = aestNow.getUTCHours() + aestNow.getUTCMinutes()/60;
  // Days elapsed since the most recent Friday 3pm
  var daysSince = (day - 5 + 7) % 7;    // days since last Friday (by date)
  if (day === 5 && hourFrac < 15) daysSince = 7; // Friday before 3pm -> still last week
  // startMs = most recent Friday 3pm UTC (15:00 AEST = 05:00 UTC)
  var startMs = Date.UTC(aestNow.getUTCFullYear(), aestNow.getUTCMonth(), aestNow.getUTCDate(), 5, 0, 0, 0)
                - daysSince * 86400000;
  var endMs = startMs + 7 * 86400000;   // end = 7 days later (next Friday 3pm)
  return { start: new Date(startMs + offset * 7 * 86400000), end: new Date(endMs + offset * 7 * 86400000) };
}

function filterByWeek(rows, offset) {
  var b = getWeekBounds(offset);
  return rows.filter(function(r){
    if(!r.Timestamp) return false;
    var ts = new Date(r.Timestamp);
    return ts >= b.start && ts < b.end;
  });
}

function weekLabel(offset) {
  var b = getWeekBounds(offset);
  var fmt = function(d){ return d.toLocaleDateString('en-AU',{day:'numeric',month:'short',timeZone:'Australia/Sydney'}); };
  return fmt(b.start) + ' \u2013 ' + fmt(new Date(b.end.getTime()-1));
}

function changeWeek(delta) {
  weekOffset += delta;
  if (weekOffset > 0) weekOffset = 0;
  var lbl=document.getElementById('week-label');
  var bdg=document.getElementById('week-badge');

  if(lbl) lbl.textContent=weekLabel(weekOffset);
  if(bdg) bdg.textContent=weekOffset===0?'This week':weekOffset===-1?'Last week':Math.abs(weekOffset)+' weeks ago';
  if(nxt) nxt.disabled=weekOffset>=0;
  if(activeKLA) renderKLA(activeKLA);
}

// ── LOAD ─────────────────────────────────────────────────
async function loadSheets() {
  showScreen('loading'); setDot('','Connecting…');
  klaData = {}; mcData = {};
  try {
    // Load in small batches rather than ~28 at once — a burst of cold-start /
    // key-gated requests can make the first batch time out, which previously
    // showed real subjects (EES, Biology) as "No data yet". Anything that fails
    // is flagged in loadFailed and retried once below, so the count is accurate.
    await runBatched(SHEET_NAMES, loadTab, 5);
    await runBatched(MC_SHEET_NAMES, loadMCTab, 5);

    // Retry pass — re-fetch only the tabs that failed (not the empty ones).
    // By now the key is cached and the Apps Script is warm, so cold-start
    // failures from the first batch resolve here instead of poisoning the count.
    if(loadFailed.size){
      const retrySA = SHEET_NAMES.filter(k=>loadFailed.has(k));
      const retryMC = MC_SHEET_NAMES.filter(k=>loadFailed.has('MC:'+k));
      if(retrySA.length) await runBatched(retrySA, loadTab, 3);
      if(retryMC.length) await runBatched(retryMC, loadMCTab, 3);
    }

    SHEET_NAMES.forEach(k => {
      const el = document.getElementById('cnt-'+k);
      if(!el) return;
      const saN = (klaData[k]||[]).length;
      const mcN = (mcData[k+'_MC']||[]).length;
      // A tab still in loadFailed after the retry is a genuine failure — mark it
      // so a real problem is never silently displayed as "No data yet".
      const failed = loadFailed.has(k) || loadFailed.has('MC:'+k+'_MC');
      if(failed && saN===0 && mcN===0){
        el.textContent = '\u26a0 load failed — refresh';
        el.title = 'This tab could not be read after a retry. Check the Worker / Apps Script, then Refresh Data.';
      } else if(saN===0 && mcN===0){
        el.textContent = 'No data yet';
        el.title = '';
      } else {
        el.textContent = saN + ' written \u00b7 ' + mcN + ' MC';
        el.title = saN + ' short-answer submissions \u00b7 ' + mcN + ' multiple-choice attempts (all time)';
      }
    });
    setDot('live','Live · '+new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'})+'  ·  build '+BUILD);
    console.log('[CUBE dashboard] build:', BUILD);
    showScreen('dashboard');
    const first = SHEET_NAMES.find(k=>(klaData[k]||[]).length>0)||'EES';
    switchKLA(activeKLA || first);
  } catch(e) {
    setDot('err', e.message);
    document.getElementById('errmsg').textContent = e.message +
      ' — Check that the Worker is deployed, the DASH_KEY is correct, and the ' +
      'Apps Script getTab deployment is on its latest version, then Refresh.';
    showScreen('error');
  }
}

// Run an async fn over items in small batches (limits parallel proxy requests).
async function runBatched(items, fn, size){
  size = size || 5;
  for(let i=0;i<items.length;i+=size){
    await Promise.all(items.slice(i,i+size).map(fn));
  }
}

// ── Dashboard access key (Phase 1b) ────────────────────────────────────────
// The Worker /sheet endpoint is gated by DASH_KEY. This file is public (until
// Phase 2 moves it behind sureview), so the key is NOT hardcoded — it is asked
// for once per browser session and held in sessionStorage. A wrong key makes
// /sheet return 403; we clear it and warn so the next reload re-prompts.
function getDashKey(){
  let k = sessionStorage.getItem('cube_dash_key') || '';
  if(!k){
    k = (window.prompt('Enter the CUBE dashboard access key:') || '').trim();
    if(k) sessionStorage.setItem('cube_dash_key', k);
  }
  return k;
}
function clearDashKey(){ try { sessionStorage.removeItem('cube_dash_key'); } catch(_){} }

// Fetch one tab's CSV. SINGLE path: the Cloudflare Worker /sheet endpoint, which
// reads the tab through the owner-executed Apps Script (private-sheet safe).
// The former public fallbacks are gone — they required the spreadsheet to be
// "anyone with link", which Phase 1b removes in favour of a private sheet.
async function fetchTabCsv(name){
  const ok = t => t && !t.trim().startsWith('<') && !t.trim().toLowerCase().startsWith('error');
  const key = getDashKey();
  const worker = `${WORKER_BASE}/sheet?tab=${encodeURIComponent(name)}&key=${encodeURIComponent(key)}`;
  for(let attempt=0; attempt<2; attempt++){
    try {
      const r = await fetch(worker,{cache:'no-store'});
      if(r.status === 403){                       // bad/missing key — stop, re-prompt next load
        clearDashKey();
        if(!window.__dashKeyWarned){ window.__dashKeyWarned = true; alert('Dashboard key was rejected. Reload the page to re-enter it.'); }
        return null;
      }
      if(r.ok){ const t = await r.text(); if(ok(t)) return t; }
    } catch(_){}
    if(attempt===0) await new Promise(res=>setTimeout(res,400));  // brief backoff before retry
  }
  return null;
}

async function loadTab(name) {
  const text = await fetchTabCsv(name);
  if(!text) { klaData[name]=[]; loadFailed.add(name); return; }   // failed ≠ empty — flag for retry
  loadFailed.delete(name);
  const rows = parseCSV(text);

  // Recalculate percentages from raw scores — avoids proxy column name/format issues
  rows.forEach(r => {
    const awd = Number(r['Awd Mark']), qm = Number(r['Q Marks']);
    if(!isNaN(awd) && !isNaN(qm) && qm > 0) r['Mark %'] = awd / qm;
    const cxp = Number(r['CUBE XP']), cmax = Number(r['CUBE Max']);
    if(!isNaN(cxp) && !isNaN(cmax) && cmax > 0) r['CUBE %'] = cxp / cmax;
    const wxp = Number(r['Write XP']), wmax = Number(r['Write Max']);
    if(!isNaN(wxp) && !isNaN(wmax) && wmax > 0) r['Write %'] = wxp / wmax;
  });

  klaData[name] = rows.filter(r=>r.Student && String(r.Student)!=='Test Student' && String(r.Student).trim()!=='');
}

async function loadMCTab(name) {
  const text = await fetchTabCsv(name);
  if(!text) { mcData[name]=[]; loadFailed.add('MC:'+name); return; }   // failed ≠ empty
  loadFailed.delete('MC:'+name);
  const rows = parseCSV(text);
  mcData[name] = rows.filter(r=>r.Student && String(r.Student).trim()!=='');
}

function cleanHeader(h) {
  // Strip quotes, trim, normalise internal spaces
  const s = h.replace(/^["'\s]+|["'\s]+$/g,'').replace(/\s+/g,' ');
  return COL_ALIAS[s.toLowerCase()] || s;
}

// ── Layout reconciliation ────────────────────────────────────────────────────
// Tabs may use different Row-1 header orders (older science tabs, Visual Arts,
// and future subjects like Music can each differ), and some tabs also contain a
// mix of historically "old-order" and "new-order" rows. The webhook is now
// header-aware, so going forward every row matches its tab's header. The only
// rows that can disagree with their header are legacy ones. We DEFAULT to reading
// each row by its tab header (correct for any tab whose data matches its header,
// including brand-new subjects with custom columns) and only remap a row when its
// own column order — detected by where the model string sits — disagrees with the
// header. This keeps legacy rows correct without making assumptions that could
// misread a future subject's bespoke header.
const OLD_LAYOUT_KEYS = ['Timestamp','Student','Session','Attempt','Streak','Q No','Module',
  'Directive','Syllabus Kw','Stage','Model','CUBE XP','CUBE Max','CUBE %','Anno Ideas','Anno Used',
  'Anno XP','W-Con','W-Noun','W-Mod','W-Flow','W-Con Max','W-Noun Max','W-Mod Max','W-Flow Max',
  'Write XP','Write Max','Write %','Total XP','Awd Mark','Q Marks','Ind Band','Mark %',
  'Mission Category','Mission Fix','Student Phrase','Improved Version','Illegible ?','Word Count'];
const NEW_LAYOUT_KEYS = ['Timestamp','Student','Session','Attempt','Streak','Q No','Module',
  'Directive','Syllabus Kw','Stage','Sheet Tab','Model','CUBE XP','CUBE Max','Anno Ideas','Anno Used',
  'Anno XP','W-Con','W-Con Max','W-Noun','W-Noun Max','W-Mod','W-Mod Max','W-Flow','W-Flow Max',
  'Write XP','Write Max','Total XP','Awd Mark','Q Marks','Ind Band','Mission Category','Mission Fix',
  'Student Phrase','Improved Version','Illegible ?','Word Count','Mark %','Class'];

function looksLikeModel(s){ return /claude|sonnet|haiku|gpt/i.test(String(s==null?'':s)); }
function modelColIndex(vals){ return looksLikeModel(vals[10]) ? 10 : (looksLikeModel(vals[11]) ? 11 : -1); }

function parseCSV(text) {
  const lines = text.split('\n').filter(l=>l.trim());
  if(lines.length<2) return [];
  const headers = splitRow(lines[0]).map(cleanHeader);
  const headerModelIdx = headers.findIndex(h=>String(h).toLowerCase().replace(/[^a-z]/g,'')==='model');
  return lines.slice(1).map(line=>{
    const vals=splitRow(line);
    const dataModelIdx = modelColIndex(vals);
    // Only remap when the row's own layout clearly disagrees with the header.
    if(dataModelIdx !== -1 && headerModelIdx !== -1 && dataModelIdx !== headerModelIdx){
      const keys = (dataModelIdx === 11) ? NEW_LAYOUT_KEYS : OLD_LAYOUT_KEYS;
      const obj={}; keys.forEach((k,i)=>{ obj[k]=coerce(vals[i]); }); return obj;
    }
    const obj={}; headers.forEach((h,i)=>{ obj[h]=coerce(vals[i]); }); return obj;
  });
}

function splitRow(row) {
  const out=[]; let inQ=false,cur='';
  for(let i=0;i<row.length;i++){
    const c=row[i];
    if(c==='"'&&!inQ){inQ=true;}
    else if(c==='"'&&inQ&&row[i+1]==='"'){cur+='"';i++;}
    else if(c==='"'&&inQ){inQ=false;}
    else if(c===','&&!inQ){out.push(cur);cur='';}
    else cur+=c;
  }
  out.push(cur); return out;
}

function coerce(v) {
  if(v==null) return null;
  const s=String(v).replace(/^["'\s]+|["'\s]+$/g,'').trim();
  if(!s||s==='#N/A'||s==='#VALUE!'||s==='#REF!') return null;
  const n=Number(s); return isNaN(n)?s:n;
}

function hexToRgba(hex,a){
  var m=String(hex||'').replace('#','');
  if(m.length===3) m=m.split('').map(function(c){return c+c;}).join('');
  var n=parseInt(m,16); if(isNaN(n)) return 'rgba(240,192,48,'+a+')';
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Build the subject sidebar entirely from the registry (KLA columns, sub-group
// headings, class rows, per-subject counts). Reproduces the original layout.
function buildSidebar(){
  var grid=document.getElementById('subject-grid'); if(!grid) return;
  var html='';
  KLA_LAYOUT.forEach(function(L){
    var subs=SUBJECTS.filter(function(s){return s.kla===L.kla;});
    if(!subs.length) return;
    if(L.style==='single'){
      subs.forEach(function(s){
        html+='<div class="subject-box selectable" data-kla="'+esc(s.code)+'" data-code="'+esc(s.code)+'" onclick="switchKLA(\''+s.code+'\')">'
             +'<div class="kla-tag">'+esc(L.tag)+'</div>'
             +'<div class="subj-name">'+esc(s.emoji)+' '+esc(s.label)+'</div>'
             +'<div class="subj-count" id="cnt-'+esc(s.code)+'">Loading\u2026</div></div>';
      });
      return;
    }
    var itemClass=L.style==='pdhpe'?'pdhpe-subj':'multi-subj';
    var countClass=L.style==='pdhpe'?'pdhpe-count':'multi-count';
    var tagStyle=L.tagColor?' style="color:'+L.tagColor+'"':'';
    var inner='<div class="'+L.tagClass+'"'+tagStyle+'>'+esc(L.tag)+'</div>';
    var emitted=false, curGroup=null;
    subs.forEach(function(s){
      var g=s.group||null;
      if(g!==curGroup){
        curGroup=g;
        if(g){
          if(emitted) inner+='<div class="multi-divider"></div>';
          inner+='<div class="multi-sublabel" style="color:'+s.color+'">'+esc(g)+'</div>';
          emitted=true;
        }
      }
      inner+='<div class="'+itemClass+' selectable" data-code="'+esc(s.code)+'" onclick="switchKLA(\''+s.code+'\')">'
            +esc(s.emoji)+' '+esc(s.label)
            +'<span class="'+countClass+'" id="cnt-'+esc(s.code)+'">Loading\u2026</span></div>';
      emitted=true;
    });
    html+='<div class="'+L.boxClass+'" id="klabox-'+esc(L.kla)+'" data-klabox="'+esc(L.kla)+'">'+inner+'</div>';
  });
  grid.innerHTML=html;
}

// Generic, data-driven selection — no per-subject branches.
function switchKLA(kla) {
  activeKLA = kla;
  var subj = SUBJECTS.find(function(s){return s.code===kla;}) || {color:'#f0c030', kla:null};
  document.querySelectorAll('#subject-grid .selectable').forEach(function(el){
    var active = el.dataset.code === kla;
    el.classList.toggle('active', active);
    if (el.classList.contains('subject-box')) { el.style.background=''; el.style.color=''; }
    else if (active) { el.style.background = hexToRgba(subj.color,0.15); el.style.color = subj.color; }
    else { el.style.background=''; el.style.color=''; }
  });
  document.querySelectorAll('#subject-grid [data-klabox]').forEach(function(box){
    if (box.dataset.klabox === subj.kla) {
      box.style.borderColor = subj.color;
      box.style.borderWidth = '2.5px';
      box.style.boxShadow = '0 0 0 3px '+hexToRgba(subj.color,0.18)+', 0 6px 24px '+hexToRgba(subj.color,0.15);
    } else {
      box.style.borderColor = 'rgba(240,192,48,0.7)';
      box.style.borderWidth = '1.5px';
      box.style.boxShadow = '';
    }
  });
  renderKLA(kla);
}

// ── RENDER MC ANALYTICS ───────────────────────────────────
// Robust MC correctness test. NOTE: the value must be compared as a string;
// wrapping the whole comparison in String() (the old bug) yields "true"/"false",
// which are both truthy and made every attempt count as correct.
function mcIsCorrect(r){
  var v = r['Correct (Y/N)']; if(v==null) v=r.Correct; if(v==null) v='';
  v = String(v).trim().toLowerCase();
  return v==='y' || v==='yes' || v==='true' || v==='1';
}
function renderMC(kla) {
  var mcTabName = MC_TAB_FOR[kla];
  var rows = mcTabName ? (mcData[mcTabName]||[]) : [];
  var weekRows = filterByWeek(rows, weekOffset);
  var cfg = KLA[kla];
  var panel = document.getElementById('mc-panel');
  if (!panel) return;

  if (!weekRows.length) {
    panel.innerHTML = '<div class="panel" style="text-align:center;padding:2rem"><div style="color:var(--text-dim);font-size:0.85rem">No MC data this week for '+cfg.label+'.<br>Data will appear as students complete MC sessions.</div></div>';
    return;
  }

  // ── Summary stats ─────────────────────────────────────────
  var total    = weekRows.length;
  var correct  = weekRows.filter(function(r){return mcIsCorrect(r);}).length;
  var accuracy = total ? correct/total : 0;
  var students = [...new Set(weekRows.map(function(r){return r.Student;}).filter(Boolean))];
  var totalXP  = weekRows.reduce(function(s,r){return s+(Number(r['XP Earned'])||0);},0);

  // ── Accuracy by module ────────────────────────────────────
  var byMod = {};
  weekRows.forEach(function(r){
    var m = r.Module || r.module || '—';
    if(!byMod[m]) byMod[m] = {total:0,correct:0};
    byMod[m].total++;
    if(mcIsCorrect(r)) byMod[m].correct++;
  });
  var modStats = Object.entries(byMod).map(function(e){
    return {module:e[0],total:e[1].total,correct:e[1].correct,acc:e[1].total?e[1].correct/e[1].total:0};
  }).sort(function(a,b){return a.acc-b.acc;}); // worst first

  // ── Error pattern (reflection types) ─────────────────────
  var refCounts = {guessed:0,misread:0,noknowledge:0};
  weekRows.forEach(function(r){
    var rt = String(r['Reflection Type']||r.reflectionType||'').toLowerCase();
    if(rt==='guessed') refCounts.guessed++;
    else if(rt==='misread') refCounts.misread++;
    else if(rt==='noknowledge') refCounts.noknowledge++;
  });
  var wrongTotal = refCounts.guessed + refCounts.misread + refCounts.noknowledge;

  // ── Most missed questions ─────────────────────────────────
  var qMiss = {};
  weekRows.forEach(function(r){
    var isW = !(mcIsCorrect(r));
    if(!isW) return;
    var id = r['Question ID']||r.questionId||'—';
    var txt = r['Question Text']||r.questionText||id;
    if(!qMiss[id]) qMiss[id]={id:id,text:txt,count:0};
    qMiss[id].count++;
  });
  var missedQ = Object.values(qMiss).sort(function(a,b){return b.count-a.count;}).slice(0,8);

  panel.innerHTML = `
    <div class="stats-row" style="margin-bottom:1.5rem">
      <div class="stat-card ${cfg.cls}">
        <div class="stat-label">MC Attempts</div>
        <div class="stat-value">${total}</div>
        <div class="stat-sub">${students.length} student${students.length!==1?'s':''} this week</div>
      </div>
      <div class="stat-card c-neutral">
        <div class="stat-label">Accuracy</div>
        <div class="stat-value ${accuracy>=0.75?'clr-green':accuracy>=0.5?'clr-amber':'clr-red'}">${pct(accuracy)}</div>
        <div class="stat-sub">${correct} of ${total} correct</div>
      </div>
      <div class="stat-card c-neutral">
        <div class="stat-label">MC XP Earned</div>
        <div class="stat-value clr-green">${totalXP}</div>
        <div class="stat-sub">this week</div>
      </div>
      <div class="stat-card c-neutral">
        <div class="stat-label">Guessing Rate</div>
        <div class="stat-value ${wrongTotal>0?'clr-amber':'clr-green'}">${wrongTotal>0?pct(refCounts.guessed/wrongTotal):'—'}</div>
        <div class="stat-sub">of wrong answers were guesses</div>
      </div>
    </div>
    <div class="grid-2 mb">
      <div class="panel">
        <div class="panel-title">Accuracy by Module <span>lowest first — focus your teaching here</span></div>
        <div class="bar-chart">${modStats.map(function(m){return `
          <div class="bar-row">
            <div class="bar-label">${m.module}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${m.acc*100}%;background:${m.acc<0.5?'#ff6b6b':m.acc<0.75?'#e8a030':cfg.color}"></div></div>
            <div class="bar-val">${pct(m.acc)} <span style="color:var(--text-dim);font-size:0.65rem">(${m.total})</span></div>
          </div>`;}).join('')}</div>
        <div class="panel-title" style="font-size:0.72rem;margin-top:1.25rem;margin-bottom:0.75rem">Error patterns (wrong answers only)</div>
        ${wrongTotal===0?'<div class="no-data">No wrong answers this week</div>':`
        <div class="bar-chart">
          <div class="bar-row">
            <div class="bar-label">🎲 Guessing</div>
            <div class="bar-track"><div class="bar-fill" style="width:${wrongTotal?refCounts.guessed/wrongTotal*100:0}%;background:#e8a030"></div></div>
            <div class="bar-val">${refCounts.guessed}</div>
          </div>
          <div class="bar-row">
            <div class="bar-label">📚 Didn't know</div>
            <div class="bar-track"><div class="bar-fill" style="width:${wrongTotal?refCounts.noknowledge/wrongTotal*100:0}%;background:#ff6b6b"></div></div>
            <div class="bar-val">${refCounts.noknowledge}</div>
          </div>
          <div class="bar-row">
            <div class="bar-label">👁 Misread</div>
            <div class="bar-track"><div class="bar-fill" style="width:${wrongTotal?refCounts.misread/wrongTotal*100:0}%;background:#a78bfa"></div></div>
            <div class="bar-val">${refCounts.misread}</div>
          </div>
        </div>`}
      </div>
      <div class="panel">
        <div class="panel-title">Most Missed Questions <span>this week</span></div>
        ${missedQ.length===0?'<div class="no-data">No missed questions this week</div>':`
        <div class="rank-list">${missedQ.map(function(q,i){return `
          <div class="rank-row" style="align-items:flex-start">
            <span class="rank-num">${i+1}</span>
            <span class="rank-name" style="font-size:0.7rem;line-height:1.4;white-space:normal;max-width:200px" title="${q.text}">${q.text.slice(0,80)}${q.text.length>80?'…':''}</span>
            <span class="rank-val" style="color:#ff6b6b">${q.count} wrong</span>
          </div>`;}).join('')}</div>`}
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">MC Attempt Log <span>Most recent entries</span></div>
      <div style="overflow-x:auto"><table class="student-table">
        <thead><tr><th>Student</th><th>Module</th><th>Year</th><th>Question</th><th>Their Answer</th><th>Correct</th><th>Reflection</th><th>XP</th></tr></thead>
        <tbody>${weekRows.slice().reverse().slice(0,30).map(function(r){
          var ok = mcIsCorrect(r);
          return `<tr>
            <td style="font-weight:600">${r.Student||'—'}</td>
            <td style="font-family:'IBM Plex Mono',monospace;font-size:0.7rem">${r.Module||r.module||'—'}</td>
            <td style="font-size:0.7rem">${r.Year||r.year||'—'}</td>
            <td style="font-size:0.68rem;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r['Question Text']||''}">${(r['Question Text']||'—').slice(0,60)}${(r['Question Text']||'').length>60?'…':''}</td>
            <td style="font-family:'IBM Plex Mono',monospace">${r['Student Answer']||r.studentAnswer||'—'}</td>
            <td style="color:${ok?'var(--green)':'var(--red)'};font-weight:700">${ok?'✓':'✗'}</td>
            <td style="font-size:0.68rem">${r['Reflection Type']||r.reflectionType||'—'}</td>
            <td style="font-family:'IBM Plex Mono',monospace">${r['XP Earned']||'0'}</td>
          </tr>`;}).join('')}</tbody>
      </table></div>
    </div>`;
}

function colourCls(val, hi, mid) {
  if(val==null||isNaN(val)) return '';
  if(val>=hi) return 'clr-green';
  if(val>=mid) return 'clr-amber';
  return 'clr-red';
}

function rankList(students, valueFn, fmt, limit) {
  limit = limit||8;
  var map={};
  students.forEach(function(r){
    var s=r.Student; if(!s) return;
    if(!map[s]) map[s]={name:s,vals:[]};
    var v=valueFn(r); if(v!=null&&!isNaN(v)) map[s].vals.push(Number(v));
  });
  var ranked=Object.values(map)
    .filter(function(s){return s.vals.length>0;})
    .map(function(s){return{name:s.name,val:avg(s.vals)};})
    .sort(function(a,b){return b.val-a.val;})
    .slice(0,limit);
  if(!ranked.length) return '<div style="font-size:0.68rem;color:var(--text-dim);padding-top:0.5rem">No data this week</div>';
  return '<div class="rank-list">'+ranked.map(function(s,i){
    return '<div class="rank-row"><span class="rank-num">'+(i+1)+'</span><span class="rank-name" title="'+s.name+'">'+s.name+'</span><span class="rank-val">'+fmt(s)+'</span></div>';
  }).join('')+'</div>';
}

function rankListCount(students, limit) {
  limit = limit||8;
  var map={};
  students.forEach(function(r){var s=r.Student; if(!s) return; map[s]=(map[s]||0)+1;});
  var ranked=Object.entries(map).map(function(e){return{name:e[0],count:e[1]};}).sort(function(a,b){return b.count-a.count;}).slice(0,limit);
  if(!ranked.length) return '<div style="font-size:0.68rem;color:var(--text-dim);padding-top:0.5rem">No submissions this week</div>';
  return '<div class="rank-list">'+ranked.map(function(s,i){
    return '<div class="rank-row"><span class="rank-num">'+(i+1)+'</span><span class="rank-name" title="'+s.name+'">'+s.name+'</span><span class="rank-val">'+s.count+'</span></div>';
  }).join('')+'</div>';
}

    '<div class="stat-card '+cfg.cls+'">'+
      '<div class="stat-label">Submissions</div>'+
      '<div class="stat-value">'+rows.length+'</div>'+
      '<div class="stat-sub">'+stu+' student'+(stu!==1?'s':'')+' this week</div>'+
      rankListCount(rows)+
    '</div>'+
    '<div class="stat-card c-neutral">'+
      '<div class="stat-label">Avg Mark</div>'+
      '<div class="stat-value '+colourCls(aM,0.75,0.5)+'">'+(aM!=null?pct(aM):'&mdash;')+'</div>'+
      '<div class="stat-sub">of available marks</div>'+
      rankList(rows.filter(function(r){return r['Mark %']!=null;}), function(r){return r['Mark %'];}, function(s){return pct(s.val);})+
    '</div>'+
    '<div class="stat-card c-neutral">'+
      '<div class="stat-label">CUBE Score</div>'+
      '<div class="stat-value '+colourCls(aC,0.7,0.45)+'">'+(rows.length?pct(aC):'&mdash;')+'</div>'+
      '<div class="stat-sub">question deconstruction</div>'+
      rankList(rows.filter(function(r){return r['CUBE %']!=null;}), function(r){return r['CUBE %'];}, function(s){return pct(s.val);})+
    '</div>'+
    '<div class="stat-card c-neutral">'+
      '<div class="stat-label">Writing Score</div>'+
      '<div class="stat-value '+colourCls(aW,0.75,0.5)+'">'+(rows.length?pct(aW):'&mdash;')+'</div>'+
      '<div class="stat-sub">literacy framework</div>'+
      rankList(rows.filter(function(r){return r['Write %']!=null;}), function(r){return r['Write %'];}, function(s){return pct(s.val);})+
    '</div>'+
    '<div class="stat-card c-neutral">'+
      '<div class="stat-label">Total XP</div>'+
      '<div class="stat-value clr-green">'+(totalXP||'&mdash;')+'</div>'+
      '<div class="stat-sub">class XP this week</div>'+
      rankList(rows.filter(function(r){return r['Total XP']!=null;}), function(r){return Number(r['Total XP'])||0;}, function(s){return Math.round(s.val)+' XP';})+
    '</div>';
}

function renderRow1(rows,cfg) {
  // ── a. Avg mark by directive ──────────────────────────────────────────────
  const byDir=groupBy(rows.filter(r=>r['Mark %']!=null),r=>r.Directive||'Unknown');
  const dirs=Object.entries(byDir).map(([d,rs])=>({label:d,val:avg(rs.map(r=>r['Mark %'])),count:rs.length})).sort((a,b)=>b.val-a.val).slice(0,8);

  // ── b. CUBE: % submissions where CUBE was attempted (CUBE XP > 0) ────────
  const cubeRows=rows.filter(r=>r['CUBE XP']!=null);
  const cubeAttempted=cubeRows.filter(r=>r['CUBE XP']>0).length;
  const cubePctAttempt=cubeRows.length>0?cubeAttempted/cubeRows.length:0;
  const cA=avg(rows.filter(r=>r['CUBE %']!=null).map(r=>r['CUBE %']));

  // ── c. Annotations ────────────────────────────────────────────────────────
  const aR=rows.filter(r=>r['Anno Ideas']!=null&&r['Anno Used']!=null);
  const tI=aR.reduce((s,r)=>s+(r['Anno Ideas']||0),0);
  const tU=aR.reduce((s,r)=>s+(r['Anno Used']||0),0);
  const ar=tI>0?tU/tI:0;
  const annoSubmissions=aR.filter(r=>(r['Anno Ideas']||0)>0).length; // submissions with any annotations

  // ── d. Writing component scores — normalised using per-row max ────────────
  function compPct(rows, scoreCol, maxCol) {
    const valid = rows.filter(r => r[scoreCol] != null && !isNaN(r[scoreCol]));
    if (!valid.length) return null;
    return avg(valid.map(r => {
      const mx = (r[maxCol] != null && !isNaN(r[maxCol]) && r[maxCol] > 0) ? r[maxCol] : 5;
      return Math.min(r[scoreCol], mx) / mx;
    }));
  }
  const wi=[
    ['Causal Connectives',       compPct(rows,'W-Con','W-Con Max'),   '#4fc3f7'],
    ['Complex Noun Groups',      compPct(rows,'W-Noun','W-Noun Max'), '#a78bfa'],
    ['Modality',                 compPct(rows,'W-Mod','W-Mod Max'),   '#e8a030'],
    ['Logical Flow & Structure', compPct(rows,'W-Flow','W-Flow Max'), '#43d9ad'],
  ].filter(([,v])=>v!=null&&!isNaN(v));

  // ── e. Literacy focus areas (4 core tools only) + legibility count separate
  const mc={};
  rows.forEach(r=>{const m=normM(r['Mission Category']);mc[m]=(mc[m]||0)+1;});
  const FOCUS_ORDER=[
    'Causal Connectives',
    'Complex Noun Groups',
    'Modality',
    'Logical Flow & Structure',
  ];
  const me=FOCUS_ORDER.filter(k=>mc[k]>0).map(k=>[k,mc[k]]);
  const maxM=me.length>0?Math.max(...me.map(e=>e[1])):1;
  const legibilityCount=mc['Legibility of handwritten response']||0;

  document.getElementById('row1').innerHTML=`
    <div class="panel">
      <div class="panel-title">Avg Mark % by HSC Directive <span>${dirs.length} directives</span></div>
      <div class="bar-chart" style="margin-bottom:1.5rem">${dirs.map(d=>`
        <div class="bar-row">
          <div class="bar-label" title="${d.label}">${d.label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${d.val*100}%;background:${cfg.color}"></div></div>
          <div class="bar-val">${pct(d.val)}</div>
        </div>`).join('')}</div>
      <div class="panel-title" style="font-size:0.72rem;margin-bottom:0.75rem">Writing component scores (% of max)</div>
      <div class="bar-chart" style="margin-bottom:1.25rem">${wi.length?wi.map(([label,val,color])=>`
        <div class="bar-row">
          <div class="bar-label">${label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${val*100}%;background:${color}"></div></div>
          <div class="bar-val">${pct(val)}</div>
        </div>`).join(''):'<div class="no-data" style="padding:0.5rem 0">No writing component data yet</div>'}</div>
      <div class="panel-title" style="font-size:0.72rem;margin-bottom:0.75rem">Literacy focus areas <span style="font-size:0.6rem;color:var(--text-dim);font-weight:400;letter-spacing:0">higher = more students needed coaching here</span></div>
      ${me.length===0?'<div class="no-data" style="padding:0.5rem 0">No literacy focus data yet</div>':`
      <div class="mission-freq">${me.map(([name,count])=>`
        <div class="mission-row">
          <div class="mission-name">${name}</div>
          <div class="mission-bar-track"><div class="mission-bar-fill" style="width:${(count/maxM)*100}%;background:${MCOL[name]||'#6b7599'}"></div></div>
          <div class="mission-count">${count}</div>
        </div>`).join('')}
      </div>`}
    </div>
    <div class="panel">
      <div class="panel-title">Question Deconstruction with CUBE</div>

      <div style="margin-bottom:1.25rem">
        <div style="font-size:0.72rem;color:var(--text-dim);margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:0.1em;font-family:'IBM Plex Mono',monospace">CUBE attempted</div>
        <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.35rem">
          <div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:1.6rem;font-weight:800;color:#4fc3f7">${Math.round(cubePctAttempt*100)}%</div>
          <div style="font-size:0.75rem;color:var(--text-dim);line-height:1.4">of submissions<br>had CUBE markings</div>
        </div>
        <div class="bar-track" style="height:6px"><div class="bar-fill" style="width:${cubePctAttempt*100}%;background:#4fc3f7"></div></div>
      </div>

      <div style="margin-bottom:1.25rem">
        <div style="font-size:0.72rem;color:var(--text-dim);margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:0.1em;font-family:'IBM Plex Mono',monospace">CUBE effectiveness</div>
        <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.35rem">
          <div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:1.6rem;font-weight:800;color:#4fc3f7">${pct(cA)}</div>
          <div style="font-size:0.75rem;color:var(--text-dim);line-height:1.4">avg accuracy of<br>CUBE markings</div>
        </div>
        <div class="bar-track" style="height:6px"><div class="bar-fill" style="width:${cA*100}%;background:#4fc3f7"></div></div>
      </div>

      <div class="panel-title" style="font-size:0.72rem;margin-bottom:0.75rem">Question annotations</div>
      ${aR.length===0?'<div class="no-data" style="padding:0.5rem 0">No annotation data available</div>':`
        <div style="margin-bottom:1rem">
          <div style="font-size:0.72rem;color:var(--text-dim);margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:0.1em;font-family:'IBM Plex Mono',monospace">Questions annotated</div>
          <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.35rem">
            <div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:1.6rem;font-weight:800;color:#c9a84c">${annoSubmissions}</div>
            <div style="font-size:0.75rem;color:var(--text-dim);line-height:1.4">of ${aR.length} submissions<br>had planning notes</div>
          </div>
          <div class="bar-track" style="height:6px"><div class="bar-fill" style="width:${aR.length>0?(annoSubmissions/aR.length)*100:0}%;background:#c9a84c"></div></div>
        </div>
        <div style="margin-bottom:1.25rem">
          <div style="font-size:0.72rem;color:var(--text-dim);margin-bottom:0.5rem;text-transform:uppercase;letter-spacing:0.1em;font-family:'IBM Plex Mono',monospace">Annotations used in response</div>
          <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.35rem">
            <div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:1.6rem;font-weight:800;color:#c9a84c">${pct(ar)}</div>
            <div style="font-size:0.75rem;color:var(--text-dim);line-height:1.4">of annotated ideas<br>used in written response</div>
          </div>
          <div class="bar-track" style="height:6px"><div class="bar-fill" style="width:${ar*100}%;background:#c9a84c"></div></div>
        </div>
      `}

      <div class="panel-title" style="font-size:0.72rem;margin-bottom:0.5rem">Handwriting clarity</div>
      <div style="display:flex;align-items:center;gap:0.75rem">
        <div style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:1.6rem;font-weight:800;color:${legibilityCount>0?'#ff6b6b':'#43d9ad'}">${legibilityCount}</div>
        <div style="font-size:0.75rem;color:var(--text-dim);line-height:1.4">${legibilityCount===0?'of '+rows.length+' submissions flagged —<br>good handwriting across the class':'of '+rows.length+' submissions flagged<br>as priority for improvement'}</div>
      </div>

    </div>`;
}

function renderRow2(rows,cfg) {
  // ── HSC Band Distribution ────────────────────────────────────────────────
  // Band-marked work (e.g. Visual Arts) is assessed holistically against NESA
  // performance-band descriptors, so it is reported here as a distribution
  // rather than folded into the Mark % averages (which are mark-based).
  function bandLabel(v){
    if(v==null) return null;
    var s=String(v).trim();
    if(/^E[1-4]$/i.test(s)) return 'Band '+s.toUpperCase();
    var n=Number(s);
    if(!isNaN(n) && Math.abs(n-Math.round(n))<1e-9){ n=Math.round(n); if(n>=1&&n<=6) return 'Band '+n; }
    return null; // fractional / non-band values (e.g. a stray Mark %) are not bands
  }
  var counts={};
  rows.forEach(function(r){ var b=bandLabel(r['Ind Band']); if(b) counts[b]=(counts[b]||0)+1; });
  var labels=Object.keys(counts);
  if(!labels.length){ document.getElementById('row2').innerHTML=''; return; }
  var total=labels.reduce(function(a,k){return a+counts[k];},0);
  function rank(l){ var m=l.replace('Band ',''); return /^E/i.test(m)?Number(m.slice(1)):Number(m); }
  labels.sort(function(a,b){return rank(b)-rank(a);}); // highest band first
  var maxC=Math.max.apply(null,labels.map(function(k){return counts[k];}));
  document.getElementById('row2').innerHTML=
    '<div class="panel">'+
      '<div class="panel-title">HSC Band Distribution <span>'+total+' band-marked response'+(total!==1?'s':'')+'</span></div>'+
      '<div class="bar-chart">'+labels.map(function(k){
        var c=counts[k], p=Math.round(c/total*100);
        return '<div class="bar-row">'+
            '<div class="bar-label" title="'+k+'">'+k+'</div>'+
            '<div class="bar-track"><div class="bar-fill" style="width:'+(c/maxC*100)+'%;background:'+cfg.color+'"></div></div>'+
            '<div class="bar-val">'+c+' <span style="color:var(--text-dim)">('+p+'%)</span></div>'+
          '</div>';
      }).join('')+'</div>'+
      '<div style="font-size:0.72rem;color:var(--text-dim);line-height:1.4;margin-top:0.85rem">'+
        'Band-marked responses are assessed holistically against NESA performance-band descriptors, '+
        'so they are shown as a distribution here and are <strong>not</strong> included in the Mark&nbsp;% averages above.'+
      '</div>'+
    '</div>';
}

function renderRow3(rows,cfg) {
  const ex=rows.filter(r=>r['Student Phrase']&&r['Improved Version']&&!String(r['Student Phrase']).includes('illegible')&&r['Mission Category']).slice(0,6);
  if(!ex.length){document.getElementById('row3').innerHTML='';return;}
  const mCls=m=>{const n=(m||'').toLowerCase();if(n.includes('causal'))return'fix-causal';if(n.includes('noun'))return'fix-noun';if(n.includes('flow'))return'fix-flow';if(n.includes('modal'))return'fix-mod';return'fix-other';};
  document.getElementById('row3').innerHTML=`
    <div class="panel">
      <div class="panel-title">Student Writing Improvements <span>AI-generated rewrites via CUBE framework</span></div>
      <div class="example-grid">${ex.map(r=>`
        <div class="example-card ${mCls(r['Mission Category'])}">
          <div class="ex-label">${normM(r['Mission Category'])} · ${r['Directive']||''}</div>
          <div class="ex-before">${r['Student Phrase']}</div>
          <div class="ex-after">${r['Improved Version']}</div>
          <div class="ex-kw">${r['Syllabus Kw']||''}</div>
        </div>`).join('')}</div>
    </div>`;
}

function renderRow4(rows,cfg) {
  // A row counts as a submission if it has a mark-based result (Mark %) OR a
  // band-based result (Ind Band). Band-marked subjects (e.g. Visual Arts) have
  // no Mark %, so filtering on Mark % alone hid them entirely.
  const hasBand=r=>r['Ind Band']!=null && String(r['Ind Band']).trim()!=='';
  const tr=rows.filter(r=>r['Mark %']!=null||hasBand(r)).sort((a,b)=>new Date(b.Timestamp)-new Date(a.Timestamp)).slice(0,25);
  const pill=p=>p>=0.85?'<span class="pill high">High</span>':p>=0.6?'<span class="pill mid">Mid</span>':'<span class="pill low">Low</span>';
  const bandCell=r=>hasBand(r)?`<span class="pill">Band ${r['Ind Band']}</span>`:(r['Mark %']!=null?pill(r['Mark %']):'—');
  document.getElementById('row4').innerHTML=`
    <div class="panel">
      <div class="panel-title">Submission Log <span>Most recent ${tr.length} entries</span></div>
      <div style="overflow-x:auto"><table class="student-table">
        <thead><tr><th>Student</th><th>Q No</th><th>Directive</th><th>Syllabus Keywords</th><th>Mark</th><th>Mark %</th><th>CUBE %</th><th>Write %</th><th>Literacy Focus</th><th>Band</th></tr></thead>
        <tbody>${tr.map(r=>`
          <tr>
            <td style="font-weight:600">${r.Student}</td>
            <td style="font-family:'IBM Plex Mono',monospace;font-size:0.7rem">${r['Q No']||'—'}</td>
            <td>${r.Directive||'—'}</td>
            <td style="font-size:0.7rem;color:#e8eaf0;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r['Syllabus Kw']||''}">${r['Syllabus Kw']||'—'}</td>
            <td style="font-family:'IBM Plex Mono',monospace">${r['Awd Mark']!=null?r['Awd Mark']:'—'}/${r['Q Marks']||'—'}</td>
            <td style="font-family:'IBM Plex Mono',monospace">${r['Mark %']!=null?pct(r['Mark %']):'—'}</td>
            <td style="font-family:'IBM Plex Mono',monospace">${r['CUBE %']!=null?pct(r['CUBE %']):'—'}</td>
            <td style="font-family:'IBM Plex Mono',monospace">${r['Write %']!=null?pct(r['Write %']):'—'}</td>
            <td style="font-size:0.72rem;color:#e8eaf0">${normM(r['Mission Category'])}</td>
            <td>${bandCell(r)}</td>
          </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
}

// ── UTILS ─────────────────────────────────────────────────
function avg(a){return a.length?a.reduce((s,v)=>s+v,0)/a.length:0;}
function pct(v){return Math.round((v||0)*100)+'%';}
function groupBy(a,fn){return a.reduce((acc,i)=>{const k=fn(i);if(!acc[k])acc[k]=[];acc[k].push(i);return acc;},{});}
function normM(m){
  if(!m)return'Other';
  const map={
    // Raw AI outputs → clean display labels
    'complex noun groups':'Complex Noun Groups','complexnoungroups':'Complex Noun Groups',
    'c — complex noun groups':'Complex Noun Groups',
    'logicalflow':'Logical Flow & Structure','logical flow':'Logical Flow & Structure',
    'l — logical flow & structure':'Logical Flow & Structure','structure':'Logical Flow & Structure',
    'modality':'Modality',
    'm — modality':'Modality',
    'causalconnectives':'Causal Connectives','causal connectives':'Causal Connectives',
    'b — because/but/so (causal connectives)':'Causal Connectives',
    'handwriting clarity':'Legibility of handwritten response',
    'legibility and precision':'Legibility of handwritten response',
    'legibility':'Legibility of handwritten response',
    'technical communication':'Technical Vocabulary','technical accuracy':'Technical Vocabulary',
    'technical detail':'Technical Vocabulary','technical precision':'Technical Vocabulary',
    'content depth':'Content Depth','content completeness':'Content Completeness','clarity':'Clarity',
  };
  const hit = map[String(m).toLowerCase()];
  if(hit) return hit;
  // Fallback: a bare camelCase code (e.g. "causalConnectives") → "Causal Connectives".
  // Phrase-style categories (with spaces, e.g. Visual Arts frame descriptions) are left as-is.
  const s = String(m);
  if(/^[a-z]+([A-Z][a-z]+)+$/.test(s))
    return s.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()).trim();
  return s;
}

// Startup. The registry is embedded below (SUBJECTS_FALLBACK) — we do NOT fetch
// it at runtime, because the hosted URL is not reachable from school (DET)
// networks. subjects.json still ships as the human-readable canonical copy and
// for the server-side webhook to read; this dashboard uses the embedded copy.
function boot(){
  deriveFromRegistry();
  buildSidebar();
  showScreen('loading');
  loadSheets();
}
boot();
